<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>局域网直连聊天</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;min-height:100dvh;padding:16px;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#e8ecf7;font-size:16px;
    background:
      radial-gradient(1000px 600px at 12% -10%, rgba(91,140,255,.22), transparent 60%),
      radial-gradient(900px 600px at 110% 110%, rgba(124,91,255,.20), transparent 60%),
      #0b0e1a;
    -webkit-font-smoothing:antialiased;
  }
  .app{
    width:100%;max-width:440px;
    height:min(760px, calc(100dvh - 32px));
    display:flex;flex-direction:column;
    background:linear-gradient(180deg,#151a2e,#121628);
    border:1px solid #262d4d;border-radius:22px;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.55);
  }
  @media (max-width:460px){
    body{padding:0}
    .app{height:100dvh;max-width:none;border-radius:0;border:none}
  }

  /* ---------- 大厅 ---------- */
  #lobby{flex:1;display:flex;flex-direction:column;justify-content:center;gap:15px;padding:28px 24px;overflow-y:auto}
  .brand{font-size:46px;line-height:1;text-align:center;filter:drop-shadow(0 10px 22px rgba(91,140,255,.5))}
  #lobby h1{font-size:21px;margin:0;text-align:center;letter-spacing:.5px;font-weight:700}
  .sub{margin:0;text-align:center;color:#8d97b8;font-size:13.5px;line-height:1.6}
  .field{display:flex;flex-direction:column;gap:8px}
  .field > span{font-size:12.5px;color:#8d97b8;padding-left:2px}
  .code-row{display:flex;gap:8px}
  .code-row input{flex:1}

  input,textarea{
    width:100%;font:inherit;font-size:16px;color:#e8ecf7;
    background:#101527;border:1px solid #262d4d;border-radius:13px;
    padding:12px 14px;outline:none;transition:.18s;
  }
  input::placeholder,textarea::placeholder{color:#5f6b8e}
  input:focus,textarea:focus{border-color:#5b8cff;box-shadow:0 0 0 3px rgba(91,140,255,.16)}

  button{
    font:inherit;font-size:15px;cursor:pointer;border:none;
    border-radius:13px;padding:12px 16px;color:#fff;transition:.16s;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:scale(.98)}
  .primary{flex:1;background:linear-gradient(135deg,#4f7dff,#7c5bff);box-shadow:0 10px 22px rgba(79,125,255,.28)}
  .ghost{flex:1;background:#1d2340;border:1px solid #262d4d;color:#e8ecf7}
  .mini{padding:0 16px;background:#1d2340;border:1px solid #262d4d;color:#a9b4d6;font-size:14px;white-space:nowrap}
  .row{display:flex;gap:10px}

  .lobby-msg{min-height:18px;margin:0;font-size:13px;text-align:center;color:#8d97b8;line-height:1.5}
  .lobby-msg.error{color:#ff7a8a}
  .lobby-msg.ok{color:#41d6ac}

  .hint{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
  .hint li{font-size:12.5px;color:#6b769b;line-height:1.5;padding-left:18px;position:relative}
  .hint li::before{content:"·";position:absolute;left:6px;color:#4f7dff;font-weight:700}

  /* ---------- 聊天 ---------- */
  #chat{flex:1;display:flex;flex-direction:column;min-height:0}
  .chat-header{
    display:flex;align-items:center;gap:11px;
    padding:12px 14px;background:#1a2038;border-bottom:1px solid #262d4d;
    padding-top:calc(12px + env(safe-area-inset-top));
  }
  .dot{width:9px;height:9px;border-radius:50%;flex:none;background:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.15);transition:.25s}
  .dot.online{background:#31d0aa;box-shadow:0 0 0 3px rgba(49,208,170,.18)}
  .dot.off{background:#ff5c72;box-shadow:0 0 0 3px rgba(255,92,114,.15)}
  .chat-title{font-size:14px;font-weight:600;letter-spacing:.3px}
  .chat-title b{color:#7fa4ff;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:1px}
  .chat-sub{font-size:12px;color:#8d97b8;margin-top:3px}
  .header-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{padding:8px 12px;font-size:13px;background:rgba(255,255,255,.07);color:#c9d3ee;border-radius:10px}

  #messages{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
  #messages::-webkit-scrollbar{width:6px}
  #messages::-webkit-scrollbar-thumb{background:#2a3255;border-radius:3px}

  .sys{align-self:center;font-size:12px;color:#7d88ab;background:rgba(255,255,255,.05);
       padding:5px 12px;border-radius:999px;text-align:center;max-width:90%}
  .row-msg{display:flex;flex-direction:column;max-width:80%}
  .row-msg.mine{align-self:flex-end;align-items:flex-end}
  .row-msg.theirs{align-self:flex-start;align-items:flex-start}
  .name{font-size:11px;color:#7d88ab;margin:0 6px 4px}
  .bubble{
    padding:9px 13px;border-radius:15px;font-size:15px;line-height:1.5;
    word-break:break-word;white-space:pre-wrap;
  }
  .mine .bubble{background:linear-gradient(135deg,#4f7dff,#7c5bff);border-bottom-right-radius:5px;box-shadow:0 6px 16px rgba(79,125,255,.22)}
  .theirs .bubble{background:#1e2542;border:1px solid #262d4d;border-bottom-left-radius:5px}
  .time{font-size:10.5px;color:#5f6b8e;margin:4px 6px 0}

  .chat-footer{
    display:flex;gap:8px;padding:10px;background:#1a2038;border-top:1px solid #262d4d;
    align-items:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom));
  }
  #input{resize:none;max-height:112px;line-height:1.45;padding:10px 12px;border-radius:13px}
  #btnSend{flex:none;padding:11px 20px;background:linear-gradient(135deg,#4f7dff,#7c5bff);border-radius:13px}
  #btnSend:disabled{opacity:.45}

  [hidden]{display:none !important}
</style>
</head>
<body>

<div class="app">

  <!-- ============ 大厅 ============ -->
  <section id="lobby">
    <div class="brand">💬</div>
    <h1>局域网直连聊天</h1>
    <p class="sub">输入同一个连接码，两台设备即可开始聊天</p>

    <label class="field">
      <span>连接码</span>
      <div class="code-row">
        <input id="codeInput" maxlength="12" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="例如 7k2m9x" />
        <button id="btnRandom" class="mini" type="button">随机</button>
      </div>
    </label>

    <label class="field">
      <span>昵称（可选）</span>
      <input id="nameInput" maxlength="12" placeholder="我的昵称" />
    </label>

    <div class="row">
      <button id="btnCreate" class="primary" type="button">创建房间</button>
      <button id="btnJoin" class="ghost" type="button">加入房间</button>
    </div>

    <p id="lobbyMsg" class="lobby-msg"></p>

    <ul class="hint">
      <li>房主点「创建房间」，把连接码发给对方</li>
      <li>对方输入同一个码，点「加入房间」</li>
      <li>连上之后消息点对点直传，不经服务器</li>
    </ul>
  </section>

  <!-- ============ 聊天 ============ -->
  <section id="chat" hidden>
    <header class="chat-header">
      <span id="statusDot" class="dot"></span>
      <div>
        <div class="chat-title">房间 <b id="roomCode">------</b></div>
        <div class="chat-sub" id="statusText">正在连接…</div>
      </div>
      <div class="header-actions">
        <button id="btnCopy" class="icon-btn" type="button">复制码</button>
        <button id="btnLeave" class="icon-btn" type="button">退出</button>
      </div>
    </header>

    <main id="messages"></main>

    <footer class="chat-footer">
      <textarea id="input" rows="1" placeholder="说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button id="btnSend" type="button">发送</button>
    </footer>
  </section>

</div>

<!-- PeerJS -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"><\/script>');</script>

<script>
(function () {
  'use strict';

  /* ============================================================
   *  可配置区
   * ============================================================ */

  // 默认使用 PeerJS 官方云信令服务器：只用它交换一次握手信息，
  // 聊天数据是浏览器之间的 P2P 直连（同局域网时不会出公网）。
  //
  // 想做到「完全离线 / 纯局域网」：
  //   1. 在局域网内任意一台电脑执行：npx peerjs --port 9000
  //   2. 把下面注释打开，填那台电脑的局域网 IP
  const PEER_OPTIONS = {
    // host: '192.168.1.100',
    // port: 9000,
    // path: '/',
    // secure: false,
  };

  const ICE = {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  };

  const PREFIX = 'lanchat1-';                        // Peer ID 前缀，避免和别人撞号
  const CODE_CHARS = 'abcdefghjkmnpqrstuvwxyz23456789'; // 去掉易混淆的 i l o 0 1

  /* ============================================================ */

  const $ = function (s) { return document.querySelector(s); };

  const el = {
    lobby:    $('#lobby'),
    chat:     $('#chat'),
    codeInput:$('#codeInput'),
    nameInput:$('#nameInput'),
    lobbyMsg: $('#lobbyMsg'),
    messages: $('#messages'),
    input:    $('#input'),
    dot:      $('#statusDot'),
    status:   $('#statusText'),
    roomCode: $('#roomCode'),
    btnCopy:  $('#btnCopy'),
    btnSend:  $('#btnSend')
  };

  let peer = null;       // PeerJS 实例
  let conn = null;       // 数据通道
  let role = '';         // 'host' | 'guest'
  let roomCode = '';
  let myName = '我';
  let remoteName = '对方';
  let joinTimer = null;

  /* ---------------- 工具 ---------------- */

  function randomCode(n) {
    n = n || 6;
    const buf = new Uint8Array(n);
    crypto.getRandomValues(buf);
    let s = '';
    for (let i = 0; i < n; i++) s += CODE_CHARS[buf[i] % CODE_CHARS.length];
    return s;
  }

  function normalizeCode(v) {
    return String(v || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 16);
  }

  function fmtTime(ts) {
    const d = new Date(ts || Date.now());
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  function scrollBottom() {
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function setLobbyMsg(text, type) {
    el.lobbyMsg.textContent = text || '';
    el.lobbyMsg.className = 'lobby-msg' + (type ? ' ' + type : '');
  }

  function setStatus(text, state) {
    el.status.textContent = text;
    el.dot.className = 'dot' + (state === 'online' ? ' online' : state === 'off' ? ' off' : '');
  }

  function addSys(text) {
    const d = document.createElement('div');
    d.className = 'sys';
    d.textContent = text;          // textContent 防 XSS
    el.messages.appendChild(d);
    scrollBottom();
  }

  function addMsg(opt) {
    const row = document.createElement('div');
    row.className = 'row-msg ' + (opt.mine ? 'mine' : 'theirs');

    const name = document.createElement('div');
    name.className = 'name';
    name.textContent = opt.mine ? '我' : (opt.name || '对方');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = opt.text;

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = fmtTime(opt.ts);

    row.appendChild(name);
    row.appendChild(bubble);
    row.appendChild(time);
    el.messages.appendChild(row);
    scrollBottom();
  }

  function enterChat() {
    el.lobby.hidden = true;
    el.chat.hidden = false;
    el.roomCode.textContent = roomCode;
    setTimeout(function () { el.input.focus(); }, 60);
  }

  function resizeInput() {
    el.input.style.height = 'auto';
    el.input.style.height = Math.min(el.input.scrollHeight, 112) + 'px';
  }

  /* ---------------- 连接管理 ---------------- */

  function destroyPeer() {
    clearTimeout(joinTimer);
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    el.messages.innerHTML = '';
  }

  function bindConn(c) {
    conn = c;
    let opened = false;

    function onOpen() {
      if (opened) return;
      opened = true;
      clearTimeout(joinTimer);
      enterChat();
      setStatus('已连接', 'online');
      try { c.send({ t: 'hello', name: myName }); } catch (e) {}
    }

    c.on('open', onOpen);
    if (c.open) onOpen();

    c.on('data', function (d) {
      if (!d || typeof d !== 'object') return;

      if (d.t === 'hello') {
        remoteName = d.name || '对方';
        setStatus('已连接 · ' + remoteName, 'online');
        addSys(remoteName + ' 已进入房间');
      } else if (d.t === 'msg') {
        addMsg({ text: d.text, name: d.name || remoteName, ts: d.ts, mine: false });
      } else if (d.t === 'bye') {
        addSys('对方已离开房间');
        setStatus('对方已离开', 'off');
      }
    });

    c.on('close', function () {
      if (conn === c) {
        conn = null;
        setStatus('连接已断开', 'off');
        addSys('连接已断开');
      }
    });

    c.on('error', function () {
      setStatus('连接出错', 'off');
    });
  }

  /* ---------------- 创建房间 ---------------- */

  function createRoom() {
    const code = normalizeCode(el.codeInput.value) || randomCode(6);
    el.codeInput.value = code;

    role = 'host';
    roomCode = code;
    myName = (el.nameInput.value || '').trim() || '房主';

    setLobbyMsg('正在创建房间…');
    destroyPeer();

    const p = new Peer(PREFIX + code, Object.assign({ config: ICE, debug: 0 }, PEER_OPTIONS));
    peer = p;

    p.on('open', function () {
      if (peer !== p) return;
      setLobbyMsg('');
      enterChat();
      setStatus('等待对方加入…', 'wait');
      addSys('房间已创建，把连接码「' + code + '」发给对方');
    });

    p.on('connection', function (c) {
      if (peer !== p) return;
      if (conn && conn.open) { try { c.close(); } catch (e) {} return; } // 只允许一人
      bindConn(c);
    });

    p.on('error', function (err) {
      if (peer !== p) return;
      const t = err && err.type;
      if (t === 'unavailable-id') {
        setLobbyMsg('连接码「' + code + '」已被占用，换一个试试', 'error');
      } else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
        setLobbyMsg('连不上信令服务器，请检查网络，或改用自建 PeerServer', 'error');
      } else {
        setLobbyMsg('出错了：' + (t || err.message), 'error');
      }
    });
  }

  /* ---------------- 加入房间 ---------------- */

  function joinRoom() {
    const code = normalizeCode(el.codeInput.value);
    if (code.length < 4) {
      setLobbyMsg('请输入连接码（至少 4 位）', 'error');
      return;
    }

    role = 'guest';
    roomCode = code;
    myName = (el.nameInput.value || '').trim() || '访客';

    setLobbyMsg('正在连接…');
    destroyPeer();

    const p = new Peer(Object.assign({ config: ICE, debug: 0 }, PEER_OPTIONS));
    peer = p;

    p.on('open', function () {
      if (peer !== p) return;
      const c = p.connect(PREFIX + code, { reliable: true, metadata: { name: myName } });
      bindConn(c);

      clearTimeout(joinTimer);
      joinTimer = setTimeout(function () {
        if (!c.open && peer === p) {
          setLobbyMsg('连接超时：请确认连接码正确，且对方已创建房间并保持在线', 'error');
        }
      }, 15000);
    });

    p.on('error', function (err) {
      if (peer !== p) return;
      const t = err && err.type;
      if (t === 'peer-unavailable') {
        setLobbyMsg('找不到该房间，请检查连接码，或让对方先点「创建房间」', 'error');
      } else if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') {
        setLobbyMsg('连不上信令服务器，请检查网络', 'error');
      } else {
        setLobbyMsg('连接失败：' + (t || err.message), 'error');
      }
    });
  }

  /* ---------------- 发送消息 ---------------- */

  function sendMsg() {
    const text = el.input.value.trim();
    if (!text) return;

    if (!conn || !conn.open) {
      addSys('对方还没连上，消息未发送');
      return;
    }

    const payload = { t: 'msg', text: text, name: myName, ts: Date.now() };
    try {
      conn.send(payload);
    } catch (e) {
      addSys('发送失败，请重试');
      return;
    }

    addMsg({ text: text, name: myName, ts: payload.ts, mine: true });
    el.input.value = '';
    resizeInput();
    el.input.focus();
  }

  /* ---------------- 复制 / 退出 ---------------- */

  function copyText(text, cb) {
    function fallback() {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      ta.remove();
      cb(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { cb(true); }, fallback);
    } else {
      fallback();
    }
  }

  function leaveRoom() {
    if (!confirm('确定要退出房间吗？')) return;
    try { if (conn && conn.open) conn.send({ t: 'bye' }); } catch (e) {}
    destroyPeer();
    setTimeout(function () { location.reload(); }, 80);
  }

  /* ---------------- 事件绑定 ---------------- */

  $('#btnCreate').addEventListener('click', createRoom);
  $('#btnJoin').addEventListener('click', joinRoom);

  $('#btnRandom').addEventListener('click', function () {
    el.codeInput.value = randomCode(6);
    el.codeInput.focus();
  });

  el.codeInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); joinRoom(); }
  });

  el.btnSend.addEventListener('click', sendMsg);

  el.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });
  el.input.addEventListener('input', resizeInput);

  el.btnCopy.addEventListener('click', function () {
    copyText(roomCode, function (ok) {
      el.btnCopy.textContent = ok ? '已复制' : '复制失败';
      setTimeout(function () { el.btnCopy.textContent = '复制码'; }, 1500);
    });
  });

  $('#btnLeave').addEventListener('click', leaveRoom);

  window.addEventListener('beforeunload', function () {
    try { if (conn && conn.open) conn.send({ t: 'bye' }); } catch (e) {}
  });

  resizeInput();
})();
</script>
</body>
</html>
