<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub 文件管理</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; max-width: 860px; margin: 0 auto; padding: 1rem; background: #f6f8fa; color: #24292f; }
  h1 { font-size: 1.4rem; margin-bottom: 1rem; }
  h3 { margin: 0 0 .8rem; font-size: 1rem; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
  label { display: block; font-weight: 600; margin-bottom: .3rem; font-size: .9rem; }
  input, button, textarea { font-size: .95rem; padding: .5rem; border-radius: 6px; border: 1px solid #d0d7de; width: 100%; font-family: inherit; }
  textarea { font-family: ui-monospace, Consolas, "Courier New", monospace; min-height: 360px; resize: vertical; line-height: 1.5; }
  button { background: #1f883d; color: #fff; border: none; cursor: pointer; font-weight: 600; }
  button:hover { background: #1a7f37; }
  button:disabled { background: #94d3a2; cursor: not-allowed; }
  button.secondary { background: #0969da; }
  button.secondary:hover { background: #0757b3; }
  button.warn { background: #bf8700; }
  button.warn:hover { background: #9a6e00; }
  button.danger { background: #cf222e; }
  button.danger:hover { background: #a40e26; }
  .btn-sm { width: auto; padding: .25rem .7rem; font-size: .8rem; margin-right: 4px; }
  .row { display: flex; gap: .5rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .status { padding: .6rem .8rem; border-radius: 6px; font-size: .9rem; margin-top: .8rem; display: none; }
  .status.ok { display: block; background: #dafbe1; color: #1a7f37; }
  .status.err { display: block; background: #ffebe9; color: #cf222e; }
  .status.info { display: block; background: #ddf4ff; color: #0969da; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #d0d7de; }
  th { background: #f6f8fa; }
  .muted { color: #57606a; font-size: .85rem; }
  a { color: #0969da; }
  .hint { font-size: .8rem; color: #57606a; margin-top: .3rem; }
  .edit-actions { display: flex; gap: .5rem; margin-top: .8rem; }
  .edit-actions button { flex: 1; }
  .commit-msg { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .commit-sha { font-family: ui-monospace, Consolas, monospace; font-size: .82rem; }
  .commit-time { font-size: .82rem; color: #57606a; white-space: nowrap; }
  .toolbar { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; }
  .toolbar button { flex: 1; min-width: 140px; }
</style>
</head>
<body>

<h1>📁 GitHub 文件管理</h1>

<div class="card">
  <div id="tokenStatus" class="status info" style="display:block">正在读取 github令牌.txt …</div>
</div>

<div class="card">
  <h3>仓库设置</h3>
  <div class="row">
    <div>
      <label>Owner</label>
      <input id="owner" placeholder="你的 GitHub 用户名">
    </div>
    <div>
      <label>Repo</label>
      <input id="repo" placeholder="仓库名">
    </div>
    <div>
      <label>分支</label>
      <input id="branch" value="main">
    </div>
  </div>
  <div style="margin-top:.8rem">
    <label>路径（可留空表示根目录）</label>
    <input id="path" placeholder="例如 docs 或 images">
    <div class="hint">上传时会存到这个目录下，列表也会显示这个目录的内容。</div>
  </div>
  <div class="toolbar">
    <button id="loadBtn" class="secondary">读取文件列表</button>
    <button id="createFolderBtn" class="secondary">新建文件夹</button>
  </div>
  <div id="listStatus" class="status"></div>
</div>

<!-- ==================== 最近更新记录 ==================== -->
<div class="card">
  <h3>🕒 最近 18 条更新记录</h3>
  <div style="margin-bottom:.8rem">
    <button id="loadCommitsBtn" class="secondary">读取更新记录</button>
  </div>
  <div id="commitStatus" class="status"></div>
  <div id="commitList" class="muted">尚未加载，请先点击“读取更新记录”。</div>
</div>

<!-- ==================== 在线编辑器 ==================== -->
<div class="card" id="editCard" style="display:none">
  <h3>✏️ 编辑文件：<span id="editFileName" style="font-weight:normal;color:#0969da"></span></h3>
  <textarea id="editContent" spellcheck="false"></textarea>
  <div style="margin-top:.8rem">
    <label>提交信息（可选）</label>
    <input id="editMsg" placeholder="Update file via web">
  </div>
  <div class="edit-actions">
    <button id="saveEditBtn">保存并提交</button>
    <button id="cancelEditBtn" class="secondary">取消</button>
  </div>
  <div id="editStatus" class="status"></div>
</div>

<div class="card">
  <h3>文件列表</h3>
  <div style="margin-bottom:.8rem">
    <input id="searchInput" placeholder="🔍 在当前目录中查找文件…">
    <div class="hint">输入关键词即时过滤当前目录下的文件/文件夹名称。</div>
  </div>
  <div id="fileList" class="muted">尚未加载，请先点击“读取文件列表”。</div>
</div>

<div class="card">
  <h3>上传文件</h3>
  <input type="file" id="fileInput" multiple>
  <div style="margin-top:.8rem">
    <label>提交信息（可选）</label>
    <input id="commitMsg" placeholder="Upload via web">
  </div>
  <div style="margin-top:.8rem">
    <button id="uploadBtn">上传到仓库</button>
  </div>
  <div id="uploadStatus" class="status"></div>
</div>

<script>
// ==================== 令牌读取 ====================
let TOKEN = null;
let PASSWORD = null; // 删除密码 = "gly" + mm.txt 内容
const API = 'https://api.github.com';

async function loadToken() {
  const el = document.getElementById('tokenStatus');
  try {
    const res = await fetch(encodeURI('./glp.txt'), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    let text = (await res.text()).trim();
    if (!text) throw new Error('文件为空');

    if (!text.startsWith('github_pat_')) {
      text = 'github_pat_' + text;
    }

    TOKEN = text;
    el.className = 'status ok';
    el.textContent = '✅ 已读取令牌（' + text.slice(0, 16) + '…）';
  } catch (e) {
    el.className = 'status err';
    el.innerHTML = '❌ 无法读取 glp.txt：' + e.message +
      '<div class="hint">如果你是双击打开（file://），浏览器会禁止读取同目录文件。请用本地服务器访问；也可以在下面手动粘贴令牌。</div>' +
      '<div style="margin-top:.6rem"><input id="manualToken" placeholder="手动粘贴 GitHub 令牌（可不带前缀）">' +
      '<button style="width:auto;margin-top:.5rem" onclick="useManualToken()">使用</button></div>';
  }
}

async function loadPassword() {
  try {
    const res = await fetch(encodeURI('./mm.txt'), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = (await res.text()).trim();
    PASSWORD = 'gly' + text;
  } catch (e) {
    PASSWORD = null;
    console.warn('无法读取 mm.txt，删除功能将不可用：', e.message);
  }
}

function useManualToken() {
  let v = document.getElementById('manualToken').value.trim();
  if (!v) return;
  if (!v.startsWith('github_pat_')) {
    v = 'github_pat_' + v;
  }
  TOKEN = v;
  const el = document.getElementById('tokenStatus');
  el.className = 'status ok';
  el.textContent = '✅ 已使用手动粘贴的令牌';
}

// ==================== 通用工具 ====================
function setStatus(id, type, html) {
  const el = document.getElementById(id);
  el.className = 'status ' + type;
  el.innerHTML = html;
}
function hideStatus(id) { document.getElementById(id).className = 'status'; }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatSize(bytes) {
  if (bytes == null) return '—';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1024 / 1024).toFixed(2) + ' MB';
}
function readAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function getConfig() {
  const owner = document.getElementById('owner').value.trim();
  const repo = document.getElementById('repo').value.trim();
  const branch = document.getElementById('branch').value.trim() || 'main';
  const path = document.getElementById('path').value.trim().replace(/^\/+|\/+$/g, '');
  if (!owner || !repo) throw new Error('请填写 Owner 和 Repo');
  return { owner, repo, branch, path };
}

// 删除密码校验（文件 / 文件夹共用）
function checkPassword(label) {
  if (!PASSWORD) {
    alert('未读取到同目录的 mm.txt，无法执行删除操作。');
    return false;
  }
  const input = prompt('删除' + label + '需要密码，请输入：');
  if (input === null) return false;
  if (input !== PASSWORD) {
    alert('密码错误，删除已取消。');
    return false;
  }
  return true;
}

// ---------- Base64 <-> UTF-8 文本 ----------
function base64ToUtf8(base64) {
  const clean = base64.replace(/\s/g, '');
  const binary = atob(clean);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
function utf8ToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

// ==================== GitHub API 封装 ====================
async function gh(path, options = {}) {
  if (!TOKEN) throw new Error('未设置令牌');
  const res = await fetch(API + path, {
    ...options,
    headers: {
      'Authorization': 'Bearer ' + TOKEN,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28',
      ...(options.headers || {})
    }
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
  return data;
}

// ==================== 文件列表（分页 + 搜索） ====================
const PAGE_SIZE = 30;
let currentItems = [];      // 当前目录的完整条目
let visibleCount = PAGE_SIZE; // 已渲染条数

function renderFileList() {
  const container = document.getElementById('fileList');
  if (!currentItems || currentItems.length === 0) {
    container.innerHTML = '<span class="muted">目录为空</span>';
    return;
  }

  const keyword = (document.getElementById('searchInput').value || '').trim().toLowerCase();

  // 过滤掉占位文件 .gitkeep
  let items = currentItems.filter(it => it.name !== '.gitkeep');
  if (keyword) {
    items = items.filter(it => it.name.toLowerCase().includes(keyword));
  }

  if (items.length === 0) {
    container.innerHTML = '<span class="muted">' +
      (keyword ? '没有匹配的文件' : '目录为空') + '</span>';
    return;
  }

  const shown = items.slice(0, visibleCount);

  let html = '<table><thead><tr><th>名称</th><th>类型</th><th>大小</th><th>操作</th></tr></thead><tbody>';
  for (const item of shown) {
    const isFile = item.type === 'file';
    const size = isFile ? formatSize(item.size) : '—';
    let actions = '';
    if (isFile) {
      const p = JSON.stringify(item.path);
      const s = JSON.stringify(item.sha);
      actions = `<button class="secondary btn-sm" onclick='editFile(${p}, ${s})'>编辑</button>
                 <button class="secondary btn-sm" onclick='downloadFile(${p})'>下载</button>
                 <button class="warn btn-sm" onclick='renameFile(${p}, ${s})'>重命名</button>
                 <button class="danger btn-sm" onclick='doDelete(${p}, ${s})'>删除</button>`;
    } else if (item.type === 'dir') {
      const p = JSON.stringify(item.path);
      actions = `<button class="danger btn-sm" onclick='deleteFolder(${p})'>删除文件夹</button>`;
    }
    html += `<tr>
      <td>${escapeHtml(item.name)}</td>
      <td>${item.type === 'dir' ? '📁 目录' : '📄 文件'}</td>
      <td>${size}</td>
      <td>${actions}</td>
    </tr>`;
  }
  html += '</tbody></table>';

  if (shown.length < items.length) {
    const remain = items.length - shown.length;
    html += `<div style="margin-top:.8rem;text-align:center">
      <button class="secondary" style="width:auto" onclick="loadMoreFiles()">加载更多（还有 ${remain} 条）</button>
    </div>`;
  }

  container.innerHTML = html;
}

function loadMoreFiles() {
  visibleCount += PAGE_SIZE;
  renderFileList();
}

document.getElementById('searchInput').addEventListener('input', () => {
  visibleCount = PAGE_SIZE;
  renderFileList();
});

document.getElementById('loadBtn').addEventListener('click', async () => {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }
  setStatus('listStatus', 'info', '加载中…');
  document.getElementById('fileList').innerHTML = '<span class="muted">加载中…</span>';

  try {
    const p = cfg.path;
    const url = p
      ? `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(p)}?ref=${encodeURIComponent(cfg.branch)}`
      : `/repos/${cfg.owner}/${cfg.repo}/contents?ref=${encodeURIComponent(cfg.branch)}`;
    const data = await gh(url);

    if (!Array.isArray(data)) throw new Error(data.message || '该路径不是目录');

    currentItems = data;
    visibleCount = PAGE_SIZE;
    document.getElementById('searchInput').value = '';

    if (data.length === 0) {
      document.getElementById('fileList').innerHTML = '<span class="muted">目录为空</span>';
      hideStatus('listStatus');
      return;
    }

    renderFileList();
    hideStatus('listStatus');
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
    document.getElementById('fileList').innerHTML = '<span class="muted">加载失败</span>';
  }
});

// ==================== 新建文件夹 ====================
document.getElementById('createFolderBtn').addEventListener('click', async () => {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  const name = prompt('请输入新文件夹名称：');
  if (name === null) return;
  const folderName = name.trim().replace(/^\/+|\/+$/g, '');

  if (!folderName) { alert('文件夹名称不能为空'); return; }
  if (folderName.includes('/')) { alert('名称中不能包含 /'); return; }

  const folderPath = cfg.path ? `${cfg.path}/${folderName}` : folderName;
  const placeholderPath = `${folderPath}/.gitkeep`;

  setStatus('listStatus', 'info', '创建文件夹中…');
  try {
    // GitHub 不保存空目录，用 .gitkeep 占位
    await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(placeholderPath)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Create folder ${folderPath} via web`,
        content: '',
        branch: cfg.branch
      })
    });
    setStatus('listStatus', 'ok', '✅ 文件夹已创建：' + escapeHtml(folderPath));
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
  }
});

// ==================== 删除文件夹 ====================
async function deleteFolder(folderPath) {
  if (!checkPassword('文件夹')) return;
  if (!confirm('确定删除文件夹\n' + folderPath + '\n及其中的所有文件？此操作会创建一个删除提交。')) return;

  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  setStatus('listStatus', 'info', '删除文件夹中…');
  try {
    const ref = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
    const latestCommitSha = ref.object.sha;

    const commit = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/commits/${latestCommitSha}`);
    const baseTreeSha = commit.tree.sha;

    const treeData = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/trees/${baseTreeSha}?recursive=1`);
    if (treeData.truncated) {
      throw new Error('仓库文件过多，无法完整读取目录树，操作已取消');
    }

    const prefix = folderPath + '/';
    const entries = (treeData.tree || []).filter(t => t.type === 'blob' && t.path.startsWith(prefix));

    if (entries.length === 0) {
      throw new Error('该文件夹为空或不存在');
    }

    const newTree = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/trees`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        base_tree: baseTreeSha,
        tree: entries.map(t => ({ path: t.path, mode: t.mode, type: t.type, sha: null }))
      })
    });

    const newCommit = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/commits`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Delete folder ${folderPath} via web`,
        tree: newTree.sha,
        parents: [latestCommitSha]
      })
    });

    await gh(`/repos/${cfg.owner}/${cfg.repo}/git/refs/heads/${encodeURIComponent(cfg.branch)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: newCommit.sha })
    });

    setStatus('listStatus', 'ok', '✅ 文件夹已删除');
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
  }
}

// ==================== 下载文件 ====================
async function downloadFile(filePath) {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  setStatus('listStatus', 'info', '正在准备下载 ' + filePath + ' …');
  try {
    const data = await gh(
      `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(filePath)}?ref=${encodeURIComponent(cfg.branch)}`
    );

    if (!data.content) {
      if (data.download_url) {
        const raw = await fetch(data.download_url, { cache: 'no-store' });
        if (!raw.ok) throw new Error('HTTP ' + raw.status);
        const blob = await raw.blob();
        triggerDownload(blob, filePath);
        setStatus('listStatus', 'ok', '✅ 已开始下载 ' + filePath);
        return;
      }
      throw new Error('无法获取文件内容');
    }

    const clean = data.content.replace(/\s/g, '');
    const binary = atob(clean);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const blob = new Blob([bytes]);

    triggerDownload(blob, filePath);
    setStatus('listStatus', 'ok', '✅ 已开始下载 ' + filePath);
  } catch (e) {
    setStatus('listStatus', 'err', '❌ 下载失败：' + e.message);
  }
}

function triggerDownload(blob, filePath) {
  const fileName = filePath.split('/').pop();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// ==================== 最近更新记录 ====================
document.getElementById('loadCommitsBtn').addEventListener('click', async () => {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('commitStatus', 'err', e.message); return; }

  setStatus('commitStatus', 'info', '加载中…');
  document.getElementById('commitList').innerHTML = '<span class="muted">加载中…</span>';

  try {
    const data = await gh(
      `/repos/${cfg.owner}/${cfg.repo}/commits?sha=${encodeURIComponent(cfg.branch)}&per_page=18`
    );

    if (!Array.isArray(data)) throw new Error(data.message || '返回格式错误');

    if (data.length === 0) {
      document.getElementById('commitList').innerHTML = '<span class="muted">暂无提交记录</span>';
      hideStatus('commitStatus');
      return;
    }

    let html = '<table><thead><tr><th>时间</th><th>提交信息</th><th>作者</th><th>SHA</th></tr></thead><tbody>';
    for (const c of data) {
      const date = new Date(c.commit.author.date);
      const dateStr = date.toLocaleString('zh-CN', { hour12: false });
      const fullMsg = c.commit.message || '';
      const firstLine = fullMsg.split('\n')[0];
      const author = (c.commit.author && c.commit.author.name) || (c.author && c.author.login) || '—';
      const sha = c.sha.slice(0, 7);

      html += `<tr>
        <td class="commit-time">${escapeHtml(dateStr)}</td>
        <td class="commit-msg" title="${escapeHtml(fullMsg)}">${escapeHtml(firstLine)}</td>
        <td>${escapeHtml(author)}</td>
        <td class="commit-sha"><a href="${c.html_url}" target="_blank" rel="noopener">${sha}</a></td>
      </tr>`;
    }
    html += '</tbody></table>';
    document.getElementById('commitList').innerHTML = html;
    hideStatus('commitStatus');
  } catch (e) {
    setStatus('commitStatus', 'err', '❌ ' + e.message);
    document.getElementById('commitList').innerHTML = '<span class="muted">加载失败</span>';
  }
});

// ==================== 在线编辑 ====================
let editingFile = null;

async function editFile(filePath, sha) {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  setStatus('listStatus', 'info', '读取文件内容…');
  try {
    const data = await gh(
      `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(filePath)}?ref=${encodeURIComponent(cfg.branch)}`
    );

    if (!data.content) {
      throw new Error('该文件过大（超过 1 MB），无法在线编辑，请下载后编辑再上传');
    }

    const text = base64ToUtf8(data.content);

    if (text.indexOf('\u0000') !== -1) {
      if (!confirm('这看起来是二进制文件（如图片、压缩包），在线编辑并保存可能会损坏它。\n\n是否仍要继续？')) {
        hideStatus('listStatus');
        return;
      }
    }

    editingFile = { path: filePath, sha: data.sha };
    document.getElementById('editFileName').textContent = filePath;
    document.getElementById('editContent').value = text;
    document.getElementById('editMsg').value = '';
    hideStatus('editStatus');
    document.getElementById('editCard').style.display = 'block';
    document.getElementById('editCard').scrollIntoView({ behavior: 'smooth' });
    hideStatus('listStatus');
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
  }
}

document.getElementById('saveEditBtn').addEventListener('click', async () => {
  if (!editingFile) return;
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('editStatus', 'err', e.message); return; }

  const content = document.getElementById('editContent').value;
  const base64 = utf8ToBase64(content);
  const msg = document.getElementById('editMsg').value.trim() || `Update ${editingFile.path}`;
  const btn = document.getElementById('saveEditBtn');
  btn.disabled = true;
  setStatus('editStatus', 'info', '保存中…');

  try {
    await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(editingFile.path)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        content: base64,
        sha: editingFile.sha,
        branch: cfg.branch
      })
    });
    setStatus('editStatus', 'ok', '✅ 保存成功');
    editingFile = null;
    document.getElementById('editCard').style.display = 'none';
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('editStatus', 'err', '❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('cancelEditBtn').addEventListener('click', () => {
  editingFile = null;
  document.getElementById('editCard').style.display = 'none';
});

// ==================== 重命名（Git Trees API 原子操作） ====================
async function renameFile(oldPath, fileSha) {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  const newPath = prompt(
    '请输入新的文件名或完整路径（会替换原来的文件）：\n\n原路径：' + oldPath,
    oldPath
  );

  if (newPath === null) return;
  const trimmed = newPath.trim().replace(/^\/+|\/+$/g, '');

  if (!trimmed) { alert('新路径不能为空'); return; }
  if (trimmed === oldPath) { alert('新路径与原路径相同，未做任何更改'); return; }

  if (!confirm('确认把\n' + oldPath + '\n重命名为\n' + trimmed + ' ？')) return;

  setStatus('listStatus', 'info', '重命名中…');
  try {
    const ref = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/ref/heads/${encodeURIComponent(cfg.branch)}`);
    const latestCommitSha = ref.object.sha;

    const commit = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/commits/${latestCommitSha}`);
    const baseTreeSha = commit.tree.sha;

    const newTree = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/trees`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        base_tree: baseTreeSha,
        tree: [
          { path: oldPath, mode: '100644', type: 'blob', sha: null },
          { path: trimmed, mode: '100644', type: 'blob', sha: fileSha }
        ]
      })
    });

    const newCommit = await gh(`/repos/${cfg.owner}/${cfg.repo}/git/commits`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Rename ${oldPath} to ${trimmed}`,
        tree: newTree.sha,
        parents: [latestCommitSha]
      })
    });

    await gh(`/repos/${cfg.owner}/${cfg.repo}/git/refs/heads/${encodeURIComponent(cfg.branch)}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ sha: newCommit.sha })
    });

    setStatus('listStatus', 'ok', '✅ 已重命名');
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
  }
}

// ==================== 上传 ====================
document.getElementById('uploadBtn').addEventListener('click', async () => {
  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('uploadStatus', 'err', e.message); return; }

  const input = document.getElementById('fileInput');
  if (!input.files.length) { setStatus('uploadStatus', 'err', '请先选择文件'); return; }

  const msg = document.getElementById('commitMsg').value.trim() || 'Upload via web';
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true;
  setStatus('uploadStatus', 'info', '上传中…');

  const results = [];
  try {
    for (const file of input.files) {
      const base64 = await readAsBase64(file);
      const filePath = cfg.path ? `${cfg.path}/${file.name}` : file.name;
      const url = `/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(filePath)}`;

      let sha = null;
      try {
        const existing = await gh(`${url}?ref=${encodeURIComponent(cfg.branch)}`);
        if (existing && existing.sha) sha = existing.sha;
      } catch (e) { /* 文件不存在，忽略 */ }

      const body = {
        message: `${msg}: ${file.name}`,
        content: base64,
        branch: cfg.branch
      };
      if (sha) body.sha = sha;

      const res = await gh(url, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      results.push({ name: file.name, url: res.commit && res.commit.html_url });
    }

    setStatus('uploadStatus', 'ok',
      '✅ 上传完成：<br>' + results.map(r =>
        `• ${escapeHtml(r.name)}${r.url ? ` <a href="${r.url}" target="_blank">查看提交</a>` : ''}`
      ).join('<br>')
    );
    input.value = '';
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('uploadStatus', 'err', '❌ ' + e.message);
  } finally {
    btn.disabled = false;
  }
});

// ==================== 删除文件（需密码） ====================
async function doDelete(filePath, sha) {
  if (!checkPassword('文件')) return;

  if (!confirm('确定删除 ' + filePath + ' ？此操作会创建一个删除提交。')) return;

  let cfg;
  try { cfg = getConfig(); } catch (e) { setStatus('listStatus', 'err', e.message); return; }

  setStatus('listStatus', 'info', '删除中…');
  try {
    await gh(`/repos/${cfg.owner}/${cfg.repo}/contents/${encodeURIComponent(filePath)}`, {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: `Delete ${filePath} via web`,
        sha,
        branch: cfg.branch
      })
    });
    setStatus('listStatus', 'ok', '✅ 已删除');
    document.getElementById('loadBtn').click();
  } catch (e) {
    setStatus('listStatus', 'err', '❌ ' + e.message);
  }
}
