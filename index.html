<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>广州开元学校高一学生成绩查询</title>
<style>
  :root{
    --bg:#f2f5fa; --card:#fff; --line:#e4e9f2; --txt:#1f2937;
    --muted:#8b95a7; --brand:#3b6cf6; --good:#16a34a; --bad:#e04b4b; --warn:#d97706;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:28px 16px 40px; background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;}
  h1{
    font-size:22px;margin:0 0 20px;text-align:center;letter-spacing:1px;
    line-height:1.5;font-weight:700;user-select:none;
  }
  @media (max-width:520px){ h1{font-size:18px;letter-spacing:0;} }

  .admin-badge{
    display:inline-block; margin-left:8px; padding:3px 9px;
    background:#fff3d6; color:#b06a00; font-size:12px; font-weight:600;
    border-radius:999px; vertical-align:middle;
  }

  /* ===== 右下角提示框 ===== */
  .toast-wrap{
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 340px; pointer-events: none;
  }
  .toast{
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--bad);
    border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(16,24,40,.12);
    font-size: 13px; line-height: 1.6; color: var(--txt);
    pointer-events: auto; opacity: 0; transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease;
    word-break: break-word;
  }
  .toast.show{ opacity: 1; transform: translateY(0); }
  .toast .toast-title{
    font-weight: 700; color: var(--bad); margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .toast .toast-close{
    cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1;
    user-select: none; padding: 0 4px;
  }
  .toast .toast-close:hover{ color: var(--txt); }
  .toast.ok{ border-left-color: var(--good); }
  .toast.ok .toast-title{ color: var(--good); }
  .toast.info{ border-left-color: var(--brand); }
  .toast.info .toast-title{ color: var(--brand); }
  @media (max-width:520px){
    .toast-wrap{ right: 10px; left: 10px; bottom: 10px; max-width: none; }
  }

  .notice{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px 20px; margin-bottom:18px;
    box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .notice-title{
    display:flex; align-items:center; gap:8px;
    font-size:14px; font-weight:700; color:var(--brand); margin-bottom:10px;
  }
  .notice-title::before{
    content:''; width:4px; height:15px; background:var(--brand); border-radius:2px;
  }
  .notice-body{
    font-size:14px; line-height:1.95; color:var(--txt);
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
  }
  .notice-body.fail{ color:var(--bad); }
  .notice-body.loading{ color:var(--muted); }

  .toc-group { margin-bottom: 14px; }
  .toc-group:last-child { margin-bottom: 0; }
  .toc-subject {
    font-size: 13px; font-weight: 700; color: var(--brand);
    margin-bottom: 8px; padding-left: 9px; position: relative;
  }
  .toc-subject::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 12px;
    background: var(--brand); border-radius: 2px;
  }
  .toc-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .toc-item {
    height: auto; padding: 7px 13px; font-size: 13px; font-weight: 500;
    background: #eaf0ff; color: var(--brand); border-radius: 8px;
  }
  .toc-item:hover:not(:disabled) { background: #dbe6ff; }
  .toc-item.active { background: var(--brand); color: #fff; }

  .trend-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .trend-check {
    display: inline-flex; align-items: center; gap: 7px;
    background: #f7f9fd; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; user-select: none;
    transition:.15s;
  }
  .trend-check:hover { border-color: var(--brand); background: #eef3ff; }
  .trend-check input { margin: 0; accent-color: var(--brand); }
  .trend-check .t-id { color: var(--muted); font-size: 11px; font-family: ui-monospace,Menlo,Consolas,monospace; }

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .row{display:flex;gap:10px;}
  .row + .row{margin-top:10px;}
  input[type=text]{
    flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;outline:none;background:#fbfcfe;color:var(--txt);
    transition:.15s;
  }
  input[type=text]:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(59,108,246,.12);}
  button{
    height:44px;padding:0 20px;border:none;border-radius:10px;background:var(--brand);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
  }
  button:hover:not(:disabled){background:#2f5be0;}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{background:#c3ccdb;cursor:not-allowed;}
  button.btn-soft{background:#eaf0ff;color:var(--brand);flex:1;}
  button.btn-soft:hover:not(:disabled){background:#dbe6ff;}
  button.btn-block{width:100%;}
  .msg{margin-top:10px;font-size:13px;line-height:1.7;word-break:break-all;}
  .msg:empty{display:none;}
  .msg.error{color:var(--bad);}
  .msg.ok{color:var(--good);}
  .msg.info{color:var(--muted);}

  .raw-table-wrap{
    overflow:auto; max-height:520px; margin-top:12px;
    border:1px solid var(--line); border-radius:10px; background:#fff;
  }
  .raw-table{
    border-collapse:collapse; font-size:12.5px; white-space:nowrap;
  }
  .raw-table th, .raw-table td{
    border:1px solid var(--line); padding:5px 10px; text-align:left;
    max-width:280px; overflow:hidden; text-overflow:ellipsis;
  }
  .raw-table th{
    background:#f4f7ff; font-weight:600; position:sticky; top:0; z-index:1;
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin-top:16px;}
  .stat{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;}
  .stat .stat-l{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stat .stat-v{font-size:20px;font-weight:700;color:var(--brand);line-height:1.15;}
  .stat .stat-v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:1px;}
  .stat.warn .stat-v{color:var(--warn);}

  .stu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-top:14px;}
  .stu{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;background:#fbfcfe;cursor:pointer;transition:.15s;min-width:0;
  }
  .stu:hover{border-color:var(--brand);background:#f4f7ff;}
  .stu.active{border-color:var(--brand);background:#eaf0ff;box-shadow:0 0 0 2px rgba(59,108,246,.15);}
  .stu .rk{font-size:11px;color:var(--muted);min-width:22px;flex:0 0 auto;text-align:center;}
  .stu .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stu .sc{font-size:12px;color:var(--muted);flex:0 0 auto;}
  .stu .sc b{color:var(--brand);font-size:14px;}
  .stu .sc b.abs{color:var(--bad);font-size:12px;}
  .list-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--muted);
  }
  .list-head b{color:var(--txt);font-weight:600;}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(16,24,40,.04);
  }
  .card-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .rank-badge{
    background:linear-gradient(135deg,#3b6cf6,#6b8cff);color:#fff;font-size:13px;
    font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap;
  }
  .who{flex:1;min-width:130px;}
  .who .name{font-size:20px;font-weight:700;}
  .who .cls{font-size:12px;color:var(--muted);margin-top:3px;}
  .total{font-size:15px;color:var(--muted);}
  .total b{font-size:30px;color:var(--brand);font-weight:800;line-height:1;margin-right:2px;}
  .meta{
    display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
    border-top:1px dashed var(--line);font-size:13px;color:var(--muted);
  }
  .meta b{color:var(--txt);font-weight:600;margin-left:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:16px;}
  .q{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;background:#fbfcfe;}
  .q .qname{font-size:12px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q .qscore{font-size:17px;font-weight:700;}
  .q .qscore span{font-size:12px;color:var(--muted);font-weight:400;}
  .q .qans{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;word-break:break-all;}
  .q.full .qscore{color:var(--good);}
  .q.part .qscore{color:var(--warn);}
  .q.zero .qscore{color:var(--bad);}
  .tag-absent{
    display:inline-block;background:#fdecec;color:var(--bad);font-size:11px;
    padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;font-weight:500;
  }

  .progress-bar{
    height: 10px; background: #eaf0ff; border-radius: 5px; overflow: hidden;
    margin-top: 6px;
  }
  .progress-inner{
    height: 100%; width: 0%; background: linear-gradient(90deg, #3b6cf6, #6b8cff);
    border-radius: 5px; transition: width .25s ease;
  }
  .progress-label{
    font-size: 13px; color: var(--muted); margin-top: 8px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .progress-label b { color: var(--brand); }

  .chart-wrap{
    position: relative; margin-top: 10px;
    background: #fbfcfe; border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 4px;
  }
  .chart-wrap canvas{ display: block; width: 100%; height: 340px; }

  .trend-summary{
    margin-top: 14px; font-size: 14px; line-height: 1.8; color: var(--txt);
  }
  .trend-summary b{ color: var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">广州开元学校高一学生成绩查询<span id="adminBadge" class="admin-badge" style="display:none;">管理员</span></h1>

  <div id="mainView">
    <div class="notice">
      <div class="notice-title">公告</div>
      <div class="notice-body loading" id="noticeBody">公告加载中…</div>
    </div>

    <div class="panel" id="tocPanel" hidden>
      <label>考试目录</label>
      <div id="tocList"></div>
      <div id="tocMsg" class="msg"></div>
    </div>

    <div class="panel">
      <label for="dateInput">考试日期 / 文件名</label>
      <div class="row">
        <input id="dateInput" type="text" maxlength="60"
               placeholder="如 20260922 或 yy20260915" autocomplete="off">
        <button id="loadBtn">读取</button>
      </div>
      <div class="row">
        <button id="pickFile" class="btn-soft">选择本地文件（任意表格）</button>
      </div>
      <div class="row">
        <button id="trendBtn" class="btn-soft">查看个人以往成绩折线图</button>
      </div>
      <div class="row" id="adminLogsRow" hidden>
        <button id="adminLogsBtn" class="btn-soft">查看访问日志</button>
      </div>
      <div id="loadMsg" class="msg"></div>
      <div id="rawTableWrap"></div>
      <input id="fileInput" type="file" hidden>
    </div>

    <div class="panel" id="classPanel" hidden>
      <label for="classInput">班级</label>
      <div class="row">
        <input id="classInput" type="text" placeholder="如 1班 或 1" autocomplete="off">
        <button id="classBtn">查询</button>
      </div>
      <div id="classMsg" class="msg"></div>
      <div id="classStats" class="stats"></div>
      <div id="classListWrap"></div>
    </div>

    <div class="panel" id="searchPanel" hidden>
      <label id="searchLabel" for="nameInput">姓名（需完整输入）</label>
      <div class="row" id="idRow" style="display:none;">
        <input id="idInput" type="text" placeholder="考号（如 202630101）" autocomplete="off">
      </div>
      <div class="row">
        <input id="nameInput" type="text" placeholder="如 张三" autocomplete="off">
        <button id="searchBtn">查询</button>
      </div>
      <div id="searchMsg" class="msg"></div>
    </div>

    <div id="result"></div>
  </div>

  <div id="trendView" hidden>
    <div class="panel">
      <button id="backBtn" class="btn-soft" style="width:auto;">← 返回</button>
    </div>

    <div class="panel">
      <label id="trendLabel" for="trendName">姓名（需完整输入）</label>
      <div class="row" id="trendIdRow" style="display:none;">
        <input id="trendId" type="text" placeholder="考号（如 202630101）" autocomplete="off">
      </div>
      <div class="row">
        <input id="trendName" type="text" placeholder="如 张三" autocomplete="off">
        <button id="trendStartBtn">开始查询</button>
      </div>
      <div id="trendMsg" class="msg"></div>
    </div>

    <div class="panel">
      <label>选择要显示的考试</label>
      <div class="row" style="margin-bottom:12px;">
        <button id="selectAllBtn" class="btn-soft">全选</button>
        <button id="selectNoneBtn" class="btn-soft">全不选</button>
      </div>
      <div id="trendTOCList"></div>
    </div>

    <div class="panel" id="progressPanel" hidden>
      <label>正在计算</label>
      <div class="progress-bar"><div class="progress-inner" id="progressInner"></div></div>
      <div class="progress-label">
        <span id="progressText">准备中…</span>
        <span><b id="progressPct">0%</b></span>
      </div>
    </div>

    <div class="panel" id="trendResultPanel" hidden>
      <label>成绩折线图</label>
      <div class="chart-wrap">
        <canvas id="trendChart"></canvas>
      </div>
      <div id="trendStats" class="stats"></div>
      <div id="trendSummary" class="trend-summary"></div>
    </div>
  </div>

  <div id="adminLogsView" hidden>
    <div class="panel">
      <button id="logsBackBtn" class="btn-soft" style="width:auto;">← 返回</button>
    </div>

    <div class="panel">
      <label>访问日志</label>
      <div class="row" style="margin-bottom:12px;">
        <button id="logsRefreshBtn" class="btn-soft">刷新</button>
      </div>
      <div id="logsCountBox" class="stats" style="margin-top:0;margin-bottom:12px;"></div>
      <div id="logsMsg" class="msg"></div>
      <div id="logsContent"></div>
    </div>
  </div>
</div>

<!-- 右下角提示容器 -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
(function () {
  'use strict';

  var state = {
    sheet: null, label: '',
    tocEntries: [], trendPoints: [],
    idNameMap: null,
    githubConfig: null,
    adminMode: false
  };

  var $ = function (id) { return document.getElementById(id); };
  var pageTitle      = $('pageTitle'),
      dateInput      = $('dateInput'),
      loadBtn        = $('loadBtn'),
      loadMsg        = $('loadMsg'),
      classPanel     = $('classPanel'),
      classInput     = $('classInput'),
      classBtn       = $('classBtn'),
      classMsg       = $('classMsg'),
      classStats     = $('classStats'),
      classListWrap  = $('classListWrap'),
      searchPanel    = $('searchPanel'),
      searchLabel    = $('searchLabel'),
      idRow          = $('idRow'),
      idInput        = $('idInput'),
      nameInput      = $('nameInput'),
      searchBtn      = $('searchBtn'),
      searchMsg      = $('searchMsg'),
      resultEl       = $('result'),
      pickFile       = $('pickFile'),
      fileInput      = $('fileInput'),
      noticeBody     = $('noticeBody'),
      rawTableWrap   = $('rawTableWrap'),
      tocPanel       = $('tocPanel'),
      tocList        = $('tocList'),
      tocMsg         = $('tocMsg'),
      mainView       = $('mainView'),
      trendView      = $('trendView'),
      trendBtn       = $('trendBtn'),
      backBtn        = $('backBtn'),
      trendLabel     = $('trendLabel'),
      trendIdRow     = $('trendIdRow'),
      trendId        = $('trendId'),
      trendName      = $('trendName'),
      trendStartBtn  = $('trendStartBtn'),
      trendMsg       = $('trendMsg'),
      trendTOCList   = $('trendTOCList'),
      selectAllBtn   = $('selectAllBtn'),
      selectNoneBtn  = $('selectNoneBtn'),
      progressPanel  = $('progressPanel'),
      progressInner  = $('progressInner'),
      progressText   = $('progressText'),
      progressPct    = $('progressPct'),
      trendResultPanel = $('trendResultPanel'),
      trendChart     = $('trendChart'),
      trendStats     = $('trendStats'),
      trendSummary   = $('trendSummary'),
      adminBadge     = $('adminBadge'),
      adminLogsRow   = $('adminLogsRow'),
      adminLogsBtn   = $('adminLogsBtn'),
      adminLogsView  = $('adminLogsView'),
      logsBackBtn    = $('logsBackBtn'),
      logsRefreshBtn = $('logsRefreshBtn'),
      logsCountBox   = $('logsCountBox'),
      logsMsg        = $('logsMsg'),
      logsContent    = $('logsContent'),
      toastWrap      = $('toastWrap');

  /* =========================================================
     右下角提示框
     ========================================================= */

  function showToast(title, message, type, duration) {
    var el = document.createElement('div');
    el.className = 'toast ' + (type || 'error');

    var titleEl = document.createElement('div');
    titleEl.className = 'toast-title';
    var spanTitle = document.createElement('span');
    spanTitle.textContent = title;
    var closeBtn = document.createElement('span');
    closeBtn.className = 'toast-close';
    closeBtn.textContent = '×';
    closeBtn.addEventListener('click', function () { removeToast(el); });
    titleEl.appendChild(spanTitle);
    titleEl.appendChild(closeBtn);

    var bodyEl = document.createElement('div');
    bodyEl.className = 'toast-body';
    bodyEl.textContent = message || '';

    el.appendChild(titleEl);
    el.appendChild(bodyEl);
    toastWrap.appendChild(el);

    requestAnimationFrame(function () {
      requestAnimationFrame(function () { el.classList.add('show'); });
    });

    var timer = setTimeout(function () { removeToast(el); }, duration || 6000);
    el._timer = timer;
    return el;
  }

  function removeToast(el) {
    if (!el || !el.parentNode) return;
    if (el._timer) { clearTimeout(el._timer); el._timer = null; }
    el.classList.remove('show');
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 260);
  }

  /* =========================================================
     错误翻译
     ========================================================= */

  function translateError(err) {
    if (!err) return '未知错误';
    var msg = (err && err.message) ? String(err.message) : String(err);
    if (!msg) return '未知错误';
    if (/[\u4e00-\u9fa5]/.test(msg)) return msg;

    if (/Failed to fetch|Load failed|Failed to load/i.test(msg))
      return '网络请求失败（可能是网络问题、跨域限制或文件不存在）';
    if (/NetworkError|Network error|network request failed/i.test(msg))
      return '网络连接错误';
    if (/TypeError/i.test(msg))
      return '请求失败（可能是网络或跨域问题）';
    if (/AbortError/i.test(msg))
      return '请求被中断';
    if (/CORS|cross-origin/i.test(msg))
      return '跨域请求被拒绝（服务器未允许本站访问）';
    if (/timeout/i.test(msg))
      return '请求超时';
    if (/Not allowed to load local resource/i.test(msg))
      return '浏览器禁止直接读取本地文件';
    if (/permission|could not be read|not be read/i.test(msg))
      return '浏览器已撤销对该文件的访问权限';
    if (/Invalid HTML|could not find.*table/i.test(msg))
      return '文件内容无法识别（可能是文件不存在或格式不正确）';

    var m = msg.match(/HTTP\s+(\d+)/i);
    if (m) {
      var map = { '400':'请求参数错误','401':'身份验证失败（令牌无效）','403':'访问被拒绝（权限不足或跨域）','404':'未找到资源','405':'请求方法不被允许','409':'文件冲突（可能有并发写入）','408':'请求超时','422':'数据格式错误','429':'请求过于频繁','500':'服务器内部错误','502':'网关错误','503':'服务暂不可用','504':'网关超时' };
      return map[m[1]] || ('服务器返回错误 ' + m[1]);
    }
    return msg;
  }

  /* =========================================================
     学科映射
     ========================================================= */

  var SUBJECT_MAP = {
    yw: '语文', sx: '数学', yy: '英语',
    wl: '物理', hx: '化学', sw: '生物',
    zz: '政治', ls: '历史', dl: '地理',

    '信息技术', '通用技术',

  function parseSheetId(id) {
    var raw = String(id).trim().replace(/\.[A-Za-z0-9]{1,6}$/, '');
    var m = raw.match(/^([A-Za-z]*)(\d+)$/);
    if (!m) return { id: raw, prefix: '', date: raw, subject: '其他' };
    var prefix = (m[1] || '').toLowerCase();
    var date = m[2];
    var subject = !prefix ? '数学' : (SUBJECT_MAP[prefix] || ('其他(' + prefix.toUpperCase() + ')'));
    return { id: raw, prefix: prefix, date: date, subject: subject };
  }

  function formatDate(d) {
    if (d && d.length === 8 && /^\d+$/.test(d))
      return d.slice(0, 4) + '-' + d.slice(4, 6) + '-' + d.slice(6, 8);
    return d;
  }
  function formatDateShort(d) {
    if (d && d.length === 8 && /^\d+$/.test(d))
      return d.slice(4, 6) + '-' + d.slice(6, 8);

  /* =========================================================
     基础工具

  function setMsg(el, text, type) {
    el.textContent = text || '';

  function toNum(v) {
    if (v === undefined || v === null) return 0;
    var s = String(v).trim();
    if (s === '' || s === '零' || s === '#' || s === '-') return 0;
    var n = Number(s);
    return isFinite(n) ? n : 0;
  }

  function fmt(n) {
    if (!isFinite(n)) return '0';
    return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
  }
  function fmt1(n) { return (!isFinite(n) ? '0' : (Math.round(n * 10) / 10).toFixed(1)); }
  function fmt2(n) { return (!isFinite(n) ? '0' : (Math.round(n * 100) / 100).toFixed(2)); }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function sanitizeFileName(s) {
    return String(s == null ? '' : s).trim()
      .replace(/[\\/:*?"<>|\u0000-\u001f]/g, '')
      .replace(/\s+/g, '')
      .replace(/\.+$/, '');
  }

  var CN = { '一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','十':'10' };
  function cnToNum(m) {
    if (!m) return '';
    if (m.length === 1) return CN[m] || m;
    if (/^十[一二三四五六七八九]$/.test(m)) return '1' + CN[m[1]];
    if (/^[一二三四五六七八九]十$/.test(m)) return CN[m[0]] + '0';
    if (/^[一二三四五六七八九]十[一二三四五六七八九]$/.test(m)) return CN[m[0]] + CN[m[2]];
    return m;
  }
  function normalizeClass(s) {
    return String(s == null ? '' : s).trim().replace(/\s/g, '')
      .replace(/班$/g, '')
      .replace(/[一二三四五六七八九十]+/g, cnToNum);
  }

  function sheetURL(fileName) {
    var href = document.baseURI || location.href;
    href = href.replace(/[?#].*$/, '');
    if (!/\/$/.test(href)) href = href.replace(/[^/]*$/, '');
    return href + encodeURIComponent(fileName);
  }

  function decodeBuffer(buf) {
    var bytes = new Uint8Array(buf);
    var offset = 0;
    if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) offset = 3;
    var text = '';
    try { text = new TextDecoder('utf-8', { fatal: false }).decode(bytes.subarray(offset)); }
    catch (e) { text = ''; }
    var bad = (text.match(/\uFFFD/g) || []).length;
    if (bad > 0) {
      try {
        var alt = new TextDecoder('gbk', { fatal: false }).decode(bytes.subarray(offset));
        if ((alt.match(/\uFFFD/g) || []).length < bad) return alt;
      } catch (e2) {}
    }
    return text;
  }

  function fetchText(url) {
    return fetch(url, { cache: 'no-store', credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      return res.arrayBuffer().then(function (buf) {
        var text = decodeBuffer(buf);
        if (ct.indexOf('text/html') > -1 || /^\s*<(!doctype|html)/i.test(text)) {
          var e2 = new Error('NOT_FOUND_AS_HTML'); e2.code = 'HTML_FALLBACK'; throw e2;
        }
        return text;
      });
    });
  }

  /* 拉取原始字节；如果服务器返回 HTML（通常意味着文件不存在），
     直接标记为 NOT_FOUND，避免下游解析库报 "Invalid HTML" 之类的错误 */
  function fetchBuffer(url) {
    return fetch(url, { cache: 'no-store', credentials: 'same-origin' }).then(function (res) {
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      var ct = (res.headers.get('content-type') || '').toLowerCase();
      return res.arrayBuffer().then(function (buf) {
        if (ct.indexOf('text/html') > -1) {
          var head = new TextDecoder('utf-8', { fatal: false })
            .decode(new Uint8Array(buf).subarray(0, 300));
          if (/^\s*<(!doctype|html)/i.test(head)) {
            var e = new Error('NOT_FOUND_AS_HTML');
            e.status = 404;
            e.code = 'HTML_FALLBACK';
            throw e;
          }
        }
        return buf;
      });
    });
  }

  /* =========================================================
     SheetJS 按需加载
     ========================================================= */

  var xlsxStatus = 'none';
  var xlsxCallbacks = [];

  function ensureXLSX(cb) {
    if (typeof XLSX !== 'undefined') { cb(true); return; }
    if (xlsxStatus === 'ready') { cb(true); return; }
    if (xlsxStatus === 'failed') { cb(false); return; }
    xlsxCallbacks.push(cb);
    if (xlsxStatus === 'loading') return;
    xlsxStatus = 'loading';
    var s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload = function () {
      xlsxStatus = 'ready';
      var cbs = xlsxCallbacks.slice(); xlsxCallbacks.length = 0;
      cbs.forEach(function (f) { f(true); });
    };
    s.onerror = function () {
      xlsxStatus = 'failed';
      var cbs = xlsxCallbacks.slice(); xlsxCallbacks.length = 0;
      cbs.forEach(function (f) { f(false); });
    };
    document.head.appendChild(s);
  }

  function parseBufferToRows(buf, fileName) {
    var extMatch = fileName.match(/\.([^.]+)$/);
    var ext = extMatch ? extMatch[1].toLowerCase() : '';
    if (ext === 'xlsx' || ext === 'xls' || ext === 'xlsm' || ext === 'xlsb') {
      return new Promise(function (resolve, reject) {
        ensureXLSX(function (ok) {
          if (!ok) { reject(new Error('无法加载 Excel 解析库（需联网）')); return; }
          try {
            var bytes = new Uint8Array(buf);
            var wb = XLSX.read(bytes, { type: 'array' });
            if (!wb.SheetNames.length) { reject(new Error('工作簿中没有工作表。')); return; }
            var ws = wb.Sheets[wb.SheetNames[0]];
            var raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false });
            var rows = raw.map(function (row) {
              return row.map(function (cell) { return cell == null ? '' : String(cell).trim(); });
            }).filter(function (row) { return row.some(function (c) { return c !== ''; }); });
            resolve(rows);
          } catch (e) { reject(e); }
        });
      });
    }
    var text = decodeBuffer(buf);
    if (/^\s*<(!doctype|html)/i.test(text)) {
      var e = new Error('NOT_FOUND_AS_HTML'); e.code = 'HTML_FALLBACK';
      return Promise.reject(e);
    }
    return Promise.resolve(parseCSV(text));
  }

  /* 多后缀尝试；所有候选都失败时区分“未找到”和“其它错误” */
  function fetchSheetRows(inputName) {
    var base = inputName;
    var hasExt = /\.[A-Za-z0-9]{1,6}$/.test(base);
    var candidates = hasExt ? [base] : [
      base + '.txt', base + '.csv', base + '.xlsx', base + '.xls', base + '.xlsm', base + '.xlsb'
    ];
    var last = null;
    var allNotFound = true;

    function isNotFound(err) {
      if (!err) return true;
      if (err.status === 404) return true;
      if (err.code === 'HTML_FALLBACK') return true;
      if (err.code === 'NOT_FOUND') return true;
      return false;
    }

    function tryNext(i) {
      if (i >= candidates.length) {
        if (allNotFound || !last) {
          var e = new Error('未找到成绩单 ' + base + '（已尝试 .txt / .csv / .xlsx / .xls 等后缀），请检查文件名是否正确');
          e.code = 'NOT_FOUND';
          return Promise.reject(e);
        }
        return Promise.reject(last);
      }
      var fileName = candidates[i];
      var url = sheetURL(fileName);
      return fetchBuffer(url).then(function (buf) {
        return parseBufferToRows(buf, fileName).then(function (rows) {
          return { rows: rows, fileName: fileName, url: url };
        });
      }).catch(function (err) {
        err.url = url; err.fileName = fileName;
        if (!isNotFound(err)) allNotFound = false;
        last = err;
        return tryNext(i + 1);
      });
    }
    return tryNext(0);
  }

  /* =========================================================

  function loadGithubConfig() {
    return Promise.all([
      fetchText(sheetURL('github令牌.txt')).catch(function () { return null; }),
      fetchText(sheetURL('用户名.txt')).catch(function () { return null; })
    ]).then(function (results) {
      var tokenText = results[0];
      var nameText = results[1];

      if (tokenText == null || nameText == null) {
        throw new Error('配置文件缺失（github令牌.txt 或 用户名.txt）');
      }

      var lines1 = String(tokenText).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      var rawToken = (lines1[0] || '').replace(/^\uFEFF/, '').trim();
      if (!rawToken) throw new Error('github令牌.txt 为空');
      var token = /^github_pat_/.test(rawToken) ? rawToken : ('github_pat_' + rawToken);

      var lines2 = String(nameText).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      if (lines2[0]) lines2[0] = lines2[0].replace(/^\uFEFF/, '');
      var owner = (lines2[0] || '').trim();
      var repo = (lines2[1] || '').trim();
      var branch = (lines2[2] || '').trim() || 'main';

      if (repo && repo.indexOf('/') > -1) {
        var sp = repo.split('/');
        owner = sp[0].trim();
        repo = sp.slice(1).join('/').trim();
      }

      if (!owner) throw new Error('用户名.txt 第一行（用户名）为空');
      if (!repo) throw new Error('用户名.txt 第二行（仓库名）为空');

      state.githubConfig = {
        token: token,
        owner: owner,
        repo: repo,
        branch: branch
      };
    });
  }

  /* =========================================================
     Base64
     ========================================================= */

  function b64EncodeUTF8(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }
  function b64DecodeUTF8(b64) {
    return decodeURIComponent(escape(atob(b64.replace(/\s/g, ''))));
  }

  /* =========================================================
     GitHub API
     ========================================================= */

  var LOG_FILE = '日记.txt';
  var LOG_MAX_ENTRIES = 20;

  function ghReadFile(path) {
    if (!state.githubConfig) return Promise.reject(new Error('未配置 GitHub 令牌'));
    var cfg = state.githubConfig;
    var url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo +
              '/contents/' + encodeURIComponent(path) + '?ref=' + encodeURIComponent(cfg.branch) +
              '&_t=' + Date.now();

    return fetch(url, {
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + cfg.token,
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    }).then(function (res) {
      if (res.status === 404) return { content: '', sha: null };
      if (!res.ok) { var e = new Error('HTTP ' + res.status); e.status = res.status; throw e; }
      return res.json().then(function (data) {
        var content = '';
        if (data && data.content) {
          try { content = b64DecodeUTF8(data.content); }
          catch (e) { content = ''; }
        }
        return { content: content, sha: data ? data.sha : null };
      });
    });
  }

  function ghWriteFile(path, content, sha, message) {
    if (!state.githubConfig) return Promise.reject(new Error('未配置 GitHub 令牌'));
    var cfg = state.githubConfig;
    var url = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo +
              '/contents/' + encodeURIComponent(path);

    var body = {
      message: message || ('更新 ' + path),
      content: b64EncodeUTF8(content),
      branch: cfg.branch
    };
    if (sha) body.sha = sha;

    return fetch(url, {
      method: 'PUT',
      cache: 'no-store',
      headers: {
        'Authorization': 'Bearer ' + cfg.token,
        'Accept': 'application/vnd.github+json',
        'Content-Type': 'application/json',
        'X-GitHub-Api-Version': '2022-11-28'
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (t) {
          var e = new Error('HTTP ' + res.status + (t ? ' - ' + t.slice(0, 200) : ''));
          e.status = res.status;
          throw e;
        });
      }
      return res.json();
    });
  }

  function parseLogContent(text) {
    if (!text || !String(text).trim()) {
      return { count: 0, entries: [] };
    }
    var trimmed = String(text).trim();
    if (trimmed.charAt(0) === '{') {
      try {
        var obj = JSON.parse(trimmed);
        if (obj && typeof obj === 'object') {
          if (Array.isArray(obj.entries)) {
            return {
              count: (typeof obj.count === 'number') ? obj.count : obj.entries.length,
              entries: obj.entries.slice()
            };
          }
          return { count: 1, entries: [obj] };
        }
      } catch (e) {}
    }
    var lines = trimmed.split('\n');
    var entries = [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i].trim();
      if (!line) continue;
      try {
        var o = JSON.parse(line);
        if (o && typeof o === 'object') entries.push(o);
      } catch (e) {}
    }
    return { count: entries.length, entries: entries };
  }

  function serializeLogContent(data) {
    var entries = (data.entries || []).slice();
    if (entries.length > LOG_MAX_ENTRIES) {
      entries = entries.slice(entries.length - LOG_MAX_ENTRIES);
    }
    return JSON.stringify({
      count: (typeof data.count === 'number') ? data.count : entries.length,
      entries: entries
    }, null, 2);
  }

  function ghAppendLog(entry) {
    var MAX_RETRIES = 5;
    var BASE_DELAY = 500;

    function attempt(retriesLeft) {
      return ghReadFile(LOG_FILE).then(function (r) {
        var data = parseLogContent(r.content || '');
        data.count = (typeof data.count === 'number' ? data.count : data.entries.length) + 1;
        data.entries.push(entry);
        if (data.entries.length > LOG_MAX_ENTRIES) {
          data.entries = data.entries.slice(data.entries.length - LOG_MAX_ENTRIES);
        }
        var newContent = serializeLogContent(data);
        return ghWriteFile(LOG_FILE, newContent, r.sha,
          'add visit log (#' + data.count + ')');
      }).catch(function (e) {
        var msg = (e && e.message) ? String(e.message) : '';
        var shouldRetry = /HTTP\s+409/.test(msg) ||
                         /does not match/.test(msg) ||
                         /sha/i.test(msg) ||
                         /HTTP\s+5\d\d/.test(msg);
        if (retriesLeft > 0 && shouldRetry) {
          var delay = BASE_DELAY * Math.pow(2, MAX_RETRIES - retriesLeft);
          return new Promise(function (resolve) {
            setTimeout(resolve, delay);
          }).then(function () {
            return attempt(retriesLeft - 1);
          });
        }
        throw e;
      });
    }
    return attempt(MAX_RETRIES);
  }

     ========================================================= */

  function splitLine(line) {
    var out = [], cur = '', inQ = false, i, c;
    for (i = 0; i < line.length; i++) {
      c = line[i];
      if (inQ) {
        if (c === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
        else cur += c;
      } else {
        if (c === '"') inQ = true;
        else if (c === ',') { out.push(cur); cur = ''; }
        else cur += c;
      }
    }
    out.push(cur);
    return out.map(function (s) { return s.trim(); });
  }

  function parseCSV(text) {
    text = String(text).replace(/^\uFEFF/, '');
    var rows = [], lines = text.split(/\r?\n/);
    for (var i = 0; i < lines.length; i++) {
      if (lines[i].trim() === '') continue;
      rows.push(splitLine(lines[i]));
    }
    return rows;
  }

  function findCol(header, keyword) {
    for (var i = 0; i < header.length; i++) if (header[i].indexOf(keyword) > -1) return i;
    return -1;
  }

  /* =========================================================
     构建成绩单（含自动排名 + 按排名排序）
     ========================================================= */

  function buildSheet(rows) {
    if (!rows.length) throw new Error('文件内容为空。');
    var header = rows[0].map(function (h) { return h.replace(/^\uFEFF/, '').trim(); });
    var col = {
      rank: findCol(header, '排名'), cls: findCol(header, '班级'),
      name: header.indexOf('姓名'), absent: findCol(header, '缺考'),
      total: findCol(header, '科目总分'), obj: findCol(header, '客观分'), sub: findCol(header, '主观分')
    };
    if (col.name === -1) throw new Error('文件中没有找到“姓名”列。');

    var questions = [];
    header.forEach(function (h, i) {
      var m = h.match(/^(.+?)\s*\(\s*([\d.]+)[^)]*分\s*\)$/);
      if (!m) return;
      var qFull = parseFloat(m[2]);
      if (!isFinite(qFull)) return;
      var q = { name: m[1].trim(), full: qFull, scoreIdx: i, ansIdx: null };
      if (header[i + 1] === '作答选项') q.ansIdx = i + 1;
      questions.push(q);
    });
    if (!questions.length) throw new Error('文件中没有找到题目得分列。');

    var records = [];
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var name = (r[col.name] || '').trim();
      if (!name) continue;
      records.push({
        rank: col.rank !== -1 ? (r[col.rank] || '').trim() : '',
        cls: col.cls !== -1 ? (r[col.cls] || '').trim() : '',
        clsKey: normalizeClass(col.cls !== -1 ? r[col.cls] : ''),
        name: name,
        absent: col.absent !== -1 ? (r[col.absent] || '').trim() : '',
        total: toNum(r[col.total]), obj: toNum(r[col.obj]), sub: toNum(r[col.sub]),
        details: questions.map(function (q) {
          return { name: q.name, full: q.full, score: toNum(r[q.scoreIdx]),
            ans: q.ansIdx !== null ? (r[q.ansIdx] || '').trim() : '', hasAns: q.ansIdx !== null };
        })
      });
    }
    if (!records.length) throw new Error('没有解析到任何学生记录。');

    // 若原始文件没有排名列，按总分从高到低自动排名（并列同名次，后续跳号）
    if (col.rank === -1) {
      var ranked = records.filter(function (r) { return r.absent === ''; });
      ranked.sort(function (a, b) { return b.total - a.total; });
      var lastScore = null, lastRank = 0;
      for (var k = 0; k < ranked.length; k++) {
        if (lastScore === null || ranked[k].total !== lastScore) { lastRank = k + 1; lastScore = ranked[k].total; }
        ranked[k].rank = String(lastRank);
      }
      records.forEach(function (r) { if (r.absent !== '') r.rank = ''; });
    }

    /* 按排名升序排序；缺考或无效排名放到最后 */
    function rankValue(rec) {
      var r = String(rec.rank || '').trim();
      if (!r || r === '0') return Number.POSITIVE_INFINITY;
      var n = parseInt(r, 10);
      return isFinite(n) ? n : Number.POSITIVE_INFINITY;
    }
    records.sort(function (a, b) {
      var ra = rankValue(a);
      var rb = rankValue(b);
      if (ra !== rb) return ra - rb;
      // 排名相同时按总分从高到低
      return b.total - a.total;
    });

    return { records: records, questions: questions };
  }

  function activateSheet(sheet, label) {
    state.sheet = sheet; state.label = label;
    setMsg(loadMsg, '已读取 ' + label + '，共 ' + sheet.records.length + ' 人。', 'ok');
    classPanel.hidden = false; searchPanel.hidden = false;
    classInput.value = ''; idInput.value = ''; nameInput.value = '';
    classStats.innerHTML = ''; classListWrap.innerHTML = '';
    setMsg(classMsg, '', ''); setMsg(searchMsg, '', '');
    resultEl.innerHTML = '';
  }

  function doLoadSheet(rawName) {
    var fileName = sanitizeFileName(rawName);
    if (!fileName) { setMsg(loadMsg, '请输入考试日期或文件名。', 'error'); return; }
    dateInput.value = fileName;
    loadBtn.disabled = true; loadBtn.textContent = '读取中';
    setMsg(loadMsg, '正在读取…', 'info');
    resultEl.innerHTML = ''; classPanel.hidden = true; searchPanel.hidden = true; state.sheet = null;
    fetchSheetRows(fileName).then(function (got) {
      var sheet;
      try { sheet = buildSheet(got.rows); }
      catch (err) { setMsg(loadMsg, '读取失败：' + err.message, 'error'); return; }
      activateSheet(sheet, got.fileName);
    }).catch(function (err) {
      // 统一的“未找到”提示
      if (err && err.code === 'NOT_FOUND') {
        setMsg(loadMsg, '未找到成绩单 ' + fileName + '（已尝试 .txt / .csv / .xlsx / .xls 等后缀），请检查文件名是否正确。', 'error');
      } else if (err && (err.status === 404 || err.code === 'HTML_FALLBACK')) {
        setMsg(loadMsg, '未找到成绩单 ' + fileName + '（已尝试 .txt / .csv / .xlsx / .xls 等后缀），请检查文件名是否正确。', 'error');
      } else {
        setMsg(loadMsg, '读取失败：' + translateError(err), 'error');
      }
    }).then(function () { loadBtn.disabled = false; loadBtn.textContent = '读取'; });
  }

  function handleLoad() {
    var raw = dateInput.value.trim();
    if (raw.length > 3 && raw.slice(0, 3).toLowerCase() === 'gly') {
      var pwd = raw.slice(3).trim();
      if (pwd) {
        loadBtn.disabled = true;
        tryAdminLogin(pwd).then(function (ok) {
          loadBtn.disabled = false;
          if (!ok) doLoadSheet(raw);
        });
        return;
      }
    }
    doLoadSheet(raw);
  }

  /* =========================================================
     原始表格 & 本地文件导入
     ========================================================= */

  var MAX_RAW_ROWS = 3000;

  function showRawTable(rows) {
    rawTableWrap.innerHTML = '';
    if (!rows.length) return;
    var display = rows.length > MAX_RAW_ROWS ? rows.slice(0, MAX_RAW_ROWS) : rows;
    var colCount = 0;
    display.forEach(function (r) { if (r.length > colCount) colCount = r.length; });
    var wrap = document.createElement('div'); wrap.className = 'raw-table-wrap';
    var table = document.createElement('table'); table.className = 'raw-table';
    var thead = document.createElement('thead');
    var trh = document.createElement('tr');
    for (var c = 0; c < colCount; c++) {
      var th = document.createElement('th');
      var v = (display[0] && display[0][c] != null) ? display[0][c] : '';
      th.textContent = v || ('列 ' + (c + 1));
      trh.appendChild(th);
    }
    thead.appendChild(trh); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    for (var i = 1; i < display.length; i++) {
      var tr = document.createElement('tr');
      for (var j = 0; j < colCount; j++) {
        var td = document.createElement('td');
        td.textContent = display[i][j] == null ? '' : String(display[i][j]);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody); wrap.appendChild(table); rawTableWrap.appendChild(wrap);
    if (rows.length > MAX_RAW_ROWS) {
      var note = document.createElement('div'); note.className = 'msg info';
      note.textContent = '文件较大，仅显示前 ' + MAX_RAW_ROWS + ' 行（共 ' + rows.length + ' 行）。';
      rawTableWrap.appendChild(note);
    }
  }

  function onImported(rows, fileName) {
    if (!rows || !rows.length) { setMsg(loadMsg, '文件内容为空。', 'error'); return; }
    showRawTable(rows);
    dateInput.value = String(fileName).replace(/\.[^.]+$/, '');
    var sheet = null;
    try { sheet = buildSheet(rows); } catch (e) { sheet = null; }
    if (sheet) activateSheet(sheet, fileName);
    else {
      state.sheet = null; classPanel.hidden = true; searchPanel.hidden = true;
      resultEl.innerHTML = '';
      setMsg(loadMsg, '已读取 ' + fileName + '，已显示原始表格（非成绩单格式，无法启用查询）。', 'info');
    }
  }

  function processBuffer(buffer, name) {
    parseBufferToRows(buffer, name).then(function (rows) { onImported(rows, name); })
      .catch(function (e) { setMsg(loadMsg, '读取文件失败：' + translateError(e), 'error'); });
  }

  /* =========================================================
     考试目录
     ========================================================= */

  function loadTOC() {
    fetchText(sheetURL('ml.txt')).then(function (text) {
      var lines = String(text).replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
      var entries = [];
      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (!line || line.charAt(0) === '#') continue;
        entries.push(parseSheetId(line));
      }
      state.tocEntries = entries;
      if (!entries.length) { tocPanel.hidden = true; return; }
      renderTOC(entries);
      tocPanel.hidden = false;
    }).catch(function () { state.tocEntries = []; tocPanel.hidden = true; });
  }

  function sortSubjects(subjects) {
    subjects.sort(function (a, b) {
      var ia = SUBJECT_ORDER.indexOf(a), ib = SUBJECT_ORDER.indexOf(b);
      if (ia === -1) ia = 1000; if (ib === -1) ib = 1000;
      if (ia !== ib) return ia - ib;
      return a.localeCompare(b, 'zh');
    });
    return subjects;
  }

  function renderTOC(entries) {
    var groups = {};
    entries.forEach(function (e) {
      if (!groups[e.subject]) groups[e.subject] = [];
      groups[e.subject].push(e);
    });
    var subjects = sortSubjects(Object.keys(groups));
    tocList.innerHTML = '';
    subjects.forEach(function (subj) {
      var list = groups[subj].slice().sort(function (a, b) {
        return b.date.localeCompare(a.date) || a.id.localeCompare(b.id);
      });
      var g = document.createElement('div'); g.className = 'toc-group';
      var title = document.createElement('div'); title.className = 'toc-subject';
      title.textContent = subj + '（' + list.length + '）'; g.appendChild(title);
      var items = document.createElement('div'); items.className = 'toc-items';
      list.forEach(function (e) {
        var btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'toc-item';
        btn.textContent = formatDate(e.date); btn.title = e.id;
        btn.addEventListener('click', function () {
          var prev = tocList.querySelector('.toc-item.active');
          if (prev) prev.classList.remove('active');
          btn.classList.add('active');
          dateInput.value = e.id; handleLoad();
        });
        items.appendChild(btn);
      });
      g.appendChild(items); tocList.appendChild(g);
    });
    setMsg(tocMsg, '', '');
  }

  /* =========================================================
     班级查询
     ========================================================= */

  function doClassQuery() {
    if (!state.sheet) { setMsg(classMsg, '请先读取成绩单。', 'error'); return; }
    var raw = classInput.value.trim();
    if (!raw) { setMsg(classMsg, '请输入班级。', 'error'); return; }
    var key = normalizeClass(raw);
    var list = state.sheet.records.filter(function (r) { return r.clsKey === key; });
    classStats.innerHTML = ''; classListWrap.innerHTML = ''; resultEl.innerHTML = '';
    if (!list.length) { setMsg(classMsg, '未找到该班级。', 'error'); return; }
    var taken = list.filter(function (r) { return r.absent === ''; });
    var absentCount = list.length - taken.length;
    function avgOf(arr, field) {
      if (!arr.length) return 0;
      return arr.reduce(function (a, r) { return a + r[field]; }, 0) / arr.length;
    }
    var avgTotal = avgOf(taken, 'total'), avgObj = avgOf(taken, 'obj'), avgSub = avgOf(taken, 'sub');
    var html = '';
    html += statBox('班级人数', list.length, ' 人');
    if (absentCount > 0) html += statBox('缺考', absentCount, ' 人', true);
    html += statBox('实考人数', taken.length, ' 人');
    html += statBox('平均总分', taken.length ? fmt1(avgTotal) : '—', taken.length ? ' 分' : '');
    html += statBox('平均客观分', taken.length ? fmt1(avgObj) : '—', taken.length ? ' 分' : '');
    html += statBox('平均主观分', taken.length ? fmt1(avgSub) : '—', taken.length ? ' 分' : '');
    classStats.innerHTML = html;
    var info = (list[0].cls || raw) + ' · 共 ' + list.length + ' 人' +
      (absentCount > 0 ? '（平均分不含 ' + absentCount + ' 名缺考学生）' : '');
    if (!state.adminMode) info += ' · 如需查看个人成绩，请在下方输入姓名（及考号）。';
    setMsg(classMsg, info, 'info');

    if (state.adminMode) {
      var head = document.createElement('div'); head.className = 'list-head';
      head.innerHTML = '<span>点击学生查看详细得分</span><span>共 <b>' + list.length + '</b> 人（按排名排序）</span>';
      classListWrap.appendChild(head);
      var grid = document.createElement('div'); grid.className = 'stu-list';
      // 已按排名排序（buildSheet 保证）
      list.forEach(function (rec) {
        var el = document.createElement('div'); el.className = 'stu';
        var rankTxt = (rec.rank && rec.rank !== '0') ? rec.rank : '—';
        var scoreHtml = rec.absent ? '<b class="abs">缺考</b>' : '<b>' + esc(fmt(rec.total)) + '</b>';
        el.innerHTML = '<span class="rk">' + esc(rankTxt) + '</span>' +
          '<span class="nm">' + esc(rec.name) + '</span>' +
          '<span class="sc">' + scoreHtml + '</span>';
        el.addEventListener('click', function () {
          var prev = grid.querySelector('.stu.active');
          if (prev) prev.classList.remove('active');
          el.classList.add('active');
          resultEl.innerHTML = '';
          resultEl.appendChild(buildCard(rec));
          resultEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        grid.appendChild(el);
      });
      classListWrap.appendChild(grid);
    }
  }

  function statBox(label, value, unit, warn) {
    return '<div class="stat' + (warn ? ' warn' : '') + '">' +
      '<div class="stat-l">' + esc(label) + '</div>' +
      '<div class="stat-v">' + esc(value) + (unit ? '<small>' + esc(unit) + '</small>' : '') + '</div></div>';
  }

  /* =========================================================
     个人成绩卡片 & 查询
     ========================================================= */

  function buildCard(rec) {
    var card = document.createElement('div'); card.className = 'card';
    var isAbsent = rec.absent !== '';
    var sum = rec.details.reduce(function (a, d) { return a + d.score; }, 0);
    var head = document.createElement('div'); head.className = 'card-head';
    var rank = document.createElement('div'); rank.className = 'rank-badge';
    rank.textContent = (rec.rank && rec.rank !== '0') ? ('第 ' + rec.rank + ' 名') : '暂无排名';
    var who = document.createElement('div'); who.className = 'who';
    var nm = document.createElement('div'); nm.className = 'name'; nm.textContent = rec.name;
    if (isAbsent) { var tag = document.createElement('span'); tag.className = 'tag-absent'; tag.textContent = '缺考'; nm.appendChild(tag); }
    var cl = document.createElement('div'); cl.className = 'cls'; cl.textContent = rec.cls || '—';
    who.appendChild(nm); who.appendChild(cl);
    var total = document.createElement('div'); total.className = 'total';
    total.innerHTML = '<b>' + esc(fmt(rec.total)) + '</b>分';
    head.appendChild(rank); head.appendChild(who); head.appendChild(total);
    var meta = document.createElement('div'); meta.className = 'meta';
    meta.innerHTML = '<span>客观分<b>' + esc(fmt(rec.obj)) + '</b></span>' +
      '<span>主观分<b>' + esc(fmt(rec.sub)) + '</b></span>' +
      '<span>小题合计<b>' + esc(fmt(sum)) + '</b></span>';
    var grid = document.createElement('div'); grid.className = 'grid';
    rec.details.forEach(function (d) {
      var q = document.createElement('div');
      var cls = 'q ';
      if (d.score >= d.full) cls += 'full'; else if (d.score <= 0) cls += 'zero'; else cls += 'part';
      q.className = cls;
      var label = /^\d+$/.test(d.name) ? ('第' + d.name + '题') : d.name;
      var ansText = '';
      if (d.hasAns) ansText = (d.ans && d.ans !== '#') ? ('选 ' + d.ans) : '未作答';
      q.innerHTML = '<div class="qname">' + esc(label) + '</div>' +
        '<div class="qscore">' + esc(fmt(d.score)) + '<span>/' + esc(fmt(d.full)) + '</span></div>' +
        '<div class="qans">' + esc(ansText) + '</div>';
      grid.appendChild(q);
    });
    card.appendChild(head); card.appendChild(meta); card.appendChild(grid);
    return card;
  }

  function doSearch() {
    if (!state.sheet) { setMsg(searchMsg, '请先读取成绩单。', 'error'); return; }
    var key = nameInput.value.trim();
    resultEl.innerHTML = '';
    if (!key) { setMsg(searchMsg, '请输入姓名。', 'error'); return; }
    if (!state.adminMode) {
      var id = idInput.value.trim();
      var err = validateIdName(id, key);
      if (err) { setMsg(searchMsg, err, 'error'); return; }
    }
    var list;
    if (state.adminMode) list = state.sheet.records.filter(function (r) { return r.name.indexOf(key) > -1; });
    else list = state.sheet.records.filter(function (r) { return r.name === key; });
    if (!list.length) {
      setMsg(searchMsg, state.adminMode ? '未找到包含“' + key + '”的学生。' : '未找到“' + key + '”，请输入完整准确的姓名。', 'error');
      return;
    }
    // 结果已按排名排序（buildSheet 保证）
    setMsg(searchMsg, '找到 ' + list.length + ' 条记录（按排名排序）：', 'info');
    list.forEach(function (rec) { resultEl.appendChild(buildCard(rec)); });
  }

  /* =========================================================
     路由 & 趋势视图
     ========================================================= */

  function applyRoute() {
    var hash = location.hash;
    var isTrend = hash === '#trend';
    var isLogs = hash === '#adminLogs';
    if (isLogs && !state.adminMode) { location.hash = ''; return; }
    mainView.hidden = isTrend || isLogs;
    trendView.hidden = !isTrend;
    adminLogsView.hidden = !isLogs;
    if (isTrend) { renderTrendTOC(); window.scrollTo(0, 0); }
    if (isLogs) { loadAdminLogs(); window.scrollTo(0, 0); }
  }
  window.addEventListener('hashchange', applyRoute);

  trendBtn.addEventListener('click', function () {
    if (location.hash !== '#trend') location.hash = 'trend'; else applyRoute();
  });
  backBtn.addEventListener('click', function () {
    if (location.hash) location.hash = ''; else applyRoute();
  });
  adminLogsBtn.addEventListener('click', function () {
    if (!state.adminMode) return;
    if (location.hash !== '#adminLogs') location.hash = 'adminLogs'; else applyRoute();
  });
  logsBackBtn.addEventListener('click', function () {
    if (location.hash) location.hash = ''; else applyRoute();
  });
  logsRefreshBtn.addEventListener('click', loadAdminLogs);

  /* =========================================================
     管理员：访问日志
     ========================================================= */

  function loadAdminLogs() {
    setMsg(logsMsg, '正在加载访问日志…', 'info');
    logsContent.innerHTML = '';
    logsCountBox.innerHTML = '';

    var promise;
    if (state.githubConfig) {
      promise = ghReadFile(LOG_FILE).then(function (r) { return r.content || ''; });
    } else {
      promise = fetchText(sheetURL(LOG_FILE));
    }

    promise.then(function (text) {
      var data = parseLogContent(text);
      var statsHtml = '';
      statsHtml += statBox('累计访问', data.count, ' 次');
      statsHtml += statBox('显示条数', data.entries.length, ' 条');
      statsHtml += statBox('最多保留', LOG_MAX_ENTRIES, ' 条');
      logsCountBox.innerHTML = statsHtml;

      if (!data.entries.length) {
        setMsg(logsMsg, '暂无访问记录。', 'info');
        return;
      }
      setMsg(logsMsg, '显示最近 ' + data.entries.length + ' 条记录。', 'ok');
      renderAdminLogs(data.entries);
    }).catch(function (e) {
      var msg = translateError(e);
      if (!state.githubConfig) msg += '。未配置 GitHub 令牌，无法获取最新日志。';
      setMsg(logsMsg, '获取失败：' + msg, 'error');
    });
  }

  function renderAdminLogs(records) {
    var cols = ['序号', '时间', 'IP', '浏览器', '屏幕', '语言', '平台', '时区'];
    var wrap = document.createElement('div'); wrap.className = 'raw-table-wrap';
    var table = document.createElement('table'); table.className = 'raw-table';
    var thead = document.createElement('thead'); var trh = document.createElement('tr');
    cols.forEach(function (c) { var th = document.createElement('th'); th.textContent = c; trh.appendChild(th); });
    thead.appendChild(trh); table.appendChild(thead);
    var tbody = document.createElement('tbody');
    var list = records.slice().reverse();
    list.forEach(function (info, idx) {
      var ua = info.userAgent || '';
      var uaShort = ua.length > 70 ? ua.slice(0, 70) + '…' : ua;
      var time = info.localTime || info.timestamp || '';
      var values = [String(records.length - idx), time, info.ip || '', uaShort, info.screen || '', info.language || '', info.platform || '', info.timezone || ''];
      var tr = document.createElement('tr');
      values.forEach(function (v) {
        var td = document.createElement('td');
        td.textContent = v == null ? '' : String(v);

      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody); wrap.appendChild(table); logsContent.appendChild(wrap);
  }

  /* =========================================================
     趋势视图（折线图）
     ========================================================= */

  function renderTrendTOC() {
    var entries = state.tocEntries || [];
    if (!entries.length) {
      trendTOCList.innerHTML = '<div class="msg info" style="margin-top:0;">未读取到考试目录（ml.txt）</div>';
      return;
    }
    var groups = {};
    entries.forEach(function (e) {
      if (!groups[e.subject]) groups[e.subject] = [];
      groups[e.subject].push(e);
    });
    var subjects = sortSubjects(Object.keys(groups));
    var html = '';
    subjects.forEach(function (subj) {
      var list = groups[subj].slice().sort(function (a, b) {
        return b.date.localeCompare(a.date) || a.id.localeCompare(b.id);
      });
      html += '<div class="toc-group"><div class="toc-subject">' + esc(subj) + '（' + list.length + '）</div><div class="trend-checks">';
      list.forEach(function (e) {
        html += '<label class="trend-check"><input type="checkbox" data-id="' + esc(e.id) + '" checked>' +
          '<span>' + esc(formatDate(e.date)) + '</span><span class="t-id">' + esc(e.id) + '</span></label>';
      });
      html += '</div></div>';
    });
    trendTOCList.innerHTML = html;
  }

  selectAllBtn.addEventListener('click', function () {
    var cbs = trendTOCList.querySelectorAll('input[type="checkbox"]');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = true;
  });
  selectNoneBtn.addEventListener('click', function () {
    var cbs = trendTOCList.querySelectorAll('input[type="checkbox"]');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
  });

  function updateProgress(done, total, label) {
    var pct = total ? Math.round(done / total * 100) : 0;
    progressInner.style.width = pct + '%';
    progressPct.textContent = pct + '%';
    progressText.textContent = label || ('已完成 ' + done + ' / ' + total);
  }

  function findStudentInRows(rows, name, fuzzy) {
    if (!rows || !rows.length) return null;
    var header = rows[0].map(function (h) { return h.replace(/^\uFEFF/, '').trim(); });
    var iName = header.indexOf('姓名'), iTotal = findCol(header, '科目总分'),
        iRank = findCol(header, '排名'), iCls = findCol(header, '班级'), iAbsent = findCol(header, '缺考');
    if (iName === -1) return null;
    for (var i = 1; i < rows.length; i++) {
      var r = rows[i];
      var rName = ((r[iName] || '')).trim();
      var matched = fuzzy ? rName.indexOf(name) > -1 : rName === name;
      if (matched) {
        return { total: toNum(r[iTotal]), rank: iRank !== -1 ? (r[iRank] || '').trim() : '',
          cls: iCls !== -1 ? (r[iCls] || '').trim() : '', absent: iAbsent !== -1 ? (r[iAbsent] || '').trim() : '' };
      }
    }
    return null;
  }

  function startTrendQuery() {
    var name = trendName.value.trim();
    if (!name) { setMsg(trendMsg, '请输入姓名。', 'error'); return; }
    if (!state.adminMode) {
      var id = trendId.value.trim();
      var err = validateIdName(id, name);
      if (err) { setMsg(trendMsg, err, 'error'); return; }
    }
    var cbs = trendTOCList.querySelectorAll('input[type="checkbox"]');
    var selected = [];
    for (var i = 0; i < cbs.length; i++) if (cbs[i].checked) selected.push(cbs[i].getAttribute('data-id'));
    if (!selected.length) { setMsg(trendMsg, '请至少选择一个考试。', 'error'); return; }
    setMsg(trendMsg, '', '');
    trendResultPanel.hidden = true; progressPanel.hidden = false;
    updateProgress(0, selected.length, '准备中…');
    trendStartBtn.disabled = true; trendStartBtn.textContent = '查询中…';
    var entriesMap = {};
    (state.tocEntries || []).forEach(function (e) { entriesMap[e.id] = e; });
    selected.sort(function (a, b) {
      var ea = entriesMap[a] || parseSheetId(a), eb = entriesMap[b] || parseSheetId(b);
      return ea.date.localeCompare(eb.date) || ea.id.localeCompare(eb.id);
    });
    var fuzzy = state.adminMode, results = [], errors = [], idx = 0;
    function next() {
      if (idx >= selected.length) { finishTrendQuery(results, errors); return; }
      var sid = selected[idx];
      var entry = entriesMap[sid] || parseSheetId(sid);
      updateProgress(idx, selected.length, '正在读取 ' + sid + '…');
      fetchSheetRows(sid).then(function (got) {
        try {
          var rec = findStudentInRows(got.rows, name, fuzzy);
          if (rec) {
            results.push({ id: sid, date: entry.date, subject: entry.subject,
              label: formatDateShort(entry.date), fullLabel: formatDate(entry.date),
              total: rec.total, rank: rec.rank, cls: rec.cls, absent: rec.absent });
          } else errors.push({ id: sid, msg: '未找到该学生' });
        } catch (e) { errors.push({ id: sid, msg: '解析失败' }); }
        idx++; updateProgress(idx, selected.length); next();
      }).catch(function () { errors.push({ id: sid, msg: '读取失败' }); idx++; updateProgress(idx, selected.length); next(); });
    }
    next();
  }

  function finishTrendQuery(results, errors) {
    trendStartBtn.disabled = false; trendStartBtn.textContent = '开始查询';
    if (!results.length) {
      progressPanel.hidden = true; trendResultPanel.hidden = true;
      setMsg(trendMsg, '该学生在所选考试中没有任何记录。', 'error'); return;
    }
    var valid = results.filter(function (r) { return r.absent === ''; });
    if (!valid.length) {
      progressPanel.hidden = true; trendResultPanel.hidden = true;
      setMsg(trendMsg, '该学生在所选考试中均为缺考。', 'error'); return;
    }
    valid.sort(function (a, b) { return a.date.localeCompare(b.date) || a.id.localeCompare(b.id); });
    progressPanel.hidden = true; trendResultPanel.hidden = false;
    state.trendPoints = valid;
    requestAnimationFrame(function () { drawChart(valid); renderTrendStats(valid, errors); });
  }

  function drawChart(points) {
    var canvas = trendChart, wrap = canvas.parentNode;
    var cssW = Math.max(320, wrap.clientWidth - 8), cssH = 340;
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, cssW, cssH);
    var padL = 46, padR = 22, padT = 26, padB = 62;
    var plotW = cssW - padL - padR, plotH = cssH - padT - padB;
    var scores = points.map(function (p) { return p.total; });
    var dMin = Math.min.apply(null, scores), dMax = Math.max.apply(null, scores);
    var pad = Math.max(5, (dMax - dMin) * 0.2);
    var yMin = Math.max(0, Math.floor(dMin - pad)), yMax = Math.ceil(dMax + pad);
    if (yMin === yMax) { yMin = Math.max(0, yMin - 5); yMax += 5; }
    function xPos(i) { return points.length === 1 ? padL + plotW / 2 : padL + (i / (points.length - 1)) * plotW; }
    function yPos(v) { return padT + plotH - ((v - yMin) / (yMax - yMin)) * plotH; }
    ctx.strokeStyle = '#e4e9f2'; ctx.lineWidth = 1;
    var ySteps = 5;
    for (var i = 0; i <= ySteps; i++) {
      var v = yMin + (yMax - yMin) * i / ySteps, y = yPos(v);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.fillStyle = '#8b95a7'; ctx.font = '11px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillText(String(Math.round(v)), padL - 6, y);
    }
    ctx.strokeStyle = '#3b6cf6'; ctx.lineWidth = 2.4; ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach(function (p, i) { var x = xPos(i), y = yPos(p.total); if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y); });
    ctx.stroke();
    points.forEach(function (p, i) {
      var x = xPos(i), y = yPos(p.total);
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = '#3b6cf6'; ctx.lineWidth = 2.4; ctx.stroke();
      ctx.fillStyle = '#1f2937'; ctx.font = 'bold 11.5px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      ctx.fillText(String(Math.round(p.total)), x, y - 8);
    });
    var labelStep = points.length > 12 ? Math.ceil(points.length / 9) : 1;
    points.forEach(function (p, i) {
      if (i % labelStep !== 0 && i !== points.length - 1) return;
      var x = xPos(i);
      ctx.save(); ctx.translate(x, padT + plotH + 10); ctx.rotate(-Math.PI / 5);
      ctx.fillStyle = '#8b95a7'; ctx.font = '10.5px -apple-system, "PingFang SC", sans-serif';
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(p.label, 0, 0); ctx.restore();
    });
  }

  function renderTrendStats(points, errors) {
    var n = points.length;
    var scores = points.map(function (p) { return p.total; });
    var sum = scores.reduce(function (a, b) { return a + b; }, 0);
    var avg = sum / n;
    var maxV = Math.max.apply(null, scores), minV = Math.min.apply(null, scores);
    var maxIdx = scores.indexOf(maxV), minIdx = scores.indexOf(minV);
    var variance = 0;
    for (var i = 0; i < n; i++) variance += (scores[i] - avg) * (scores[i] - avg);
    variance /= n;
    var std = Math.sqrt(variance);
    var slope = 0;
    if (n > 1) {
      var xSum = 0, ySum = 0, xySum = 0, x2Sum = 0;
      for (var j = 0; j < n; j++) { var x = j, y = scores[j]; xSum += x; ySum += y; xySum += x * y; x2Sum += x * x; }
      var denom = n * x2Sum - xSum * xSum;
      if (denom !== 0) slope = (n * xySum - xSum * ySum) / denom;
    }
    var trendText;
    if (n < 2) trendText = '数据点不足';
    else if (slope > 1) trendText = '明显上升';
    else if (slope > 0.3) trendText = '略有上升';
    else if (slope < -1) trendText = '明显下降';
    else if (slope < -0.3) trendText = '略有下降';
    else trendText = '基本平稳';
    var waveText;
    if (n < 2) waveText = '数据点不足';
    else if (std < 3) waveText = '非常稳定';
    else if (std < 7) waveText = '比较稳定';
    else if (std < 12) waveText = '波动较大';
    else waveText = '波动很大';
    var html = '';
    html += statBox('有效次数', n, ' 次');
    html += statBox('平均分', fmt1(avg), ' 分');
    html += statBox('最高分', fmt(maxV), ' 分');
    html += statBox('最低分', fmt(minV), ' 分');
    html += statBox('标准差', fmt2(std), '');
    html += statBox('波动幅度', fmt(maxV - minV), ' 分');
    trendStats.innerHTML = html;
    var parts = [];
    parts.push('趋势：<b>' + trendText + '</b>（' + (slope >= 0 ? '+' : '') + fmt2(slope) + ' 分 / 次）');
    parts.push('起伏：<b>' + waveText + '</b>（标准差 ' + fmt2(std) + '）');
    parts.push('最高：<b>' + fmt(maxV) + '</b> 分（' + points[maxIdx].fullLabel + '）');
    parts.push('最低：<b>' + fmt(minV) + '</b> 分（' + points[minIdx].fullLabel + '）');
    var text = parts.join('　·　');
    if (errors && errors.length) {
      text += '<br><span style="color:#8b95a7;font-size:12.5px;">另有 ' + errors.length +
        ' 个文件未能读取或未找到该学生（' + errors.map(function (e) { return e.id; }).join('、') + '）</span>';
    }
    trendSummary.innerHTML = text;
  }

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    if (!state.trendPoints || !state.trendPoints.length) return;
    if (trendResultPanel.hidden) return;
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (state.trendPoints && state.trendPoints.length) drawChart(state.trendPoints);
    }, 120);
  });

  /* =========================================================
     事件绑定
     ========================================================= */

  loadBtn.addEventListener('click', handleLoad);
  classBtn.addEventListener('click', doClassQuery);
  searchBtn.addEventListener('click', doSearch);
  trendStartBtn.addEventListener('click', startTrendQuery);

  dateInput.addEventListener('input', function () {
    var v = dateInput.value.replace(/[\\/:*?"<>|]/g, '');
    if (v !== dateInput.value) dateInput.value = v;
  });
  dateInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') handleLoad(); });
  classInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doClassQuery(); });
  nameInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  idInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') doSearch(); });
  trendName.addEventListener('keydown', function (e) { if (e.key === 'Enter') startTrendQuery(); });
  trendId.addEventListener('keydown', function (e) { if (e.key === 'Enter') startTrendQuery(); });

  pickFile.addEventListener('click', function () { fileInput.value = ''; fileInput.click(); });

  fileInput.addEventListener('change', function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var name = f.name || '';
    setMsg(loadMsg, '正在读取 ' + name + '…', 'info');
    rawTableWrap.innerHTML = ''; resultEl.innerHTML = '';
    classPanel.hidden = true; searchPanel.hidden = true; state.sheet = null;
    var reader = new FileReader();
    reader.onload = function (ev) { fileInput.value = ''; processBuffer(ev.target.result, name); };
    reader.onerror = function () {
      fileInput.value = '';
      var err = reader.error;
      setMsg(loadMsg, '读取文件失败：' + translateError({ message: (err && err.message) ? err.message : '无法访问该文件' }), 'error');
    };
    reader.readAsArrayBuffer(f);
  });

  /* =========================================================
     URL 参数直达
     ========================================================= */

  (function initFromQuery() {
    var q = new URLSearchParams(location.search);
    var f = sanitizeFileName(q.get('file') || q.get('date') || '');
    var n = q.get('name') || '', c = q.get('class') || '';
    if (f) {
      dateInput.value = f; handleLoad();
      if (n || c) {
        var timer = setInterval(function () {
          if (state.sheet) {
            clearInterval(timer);
            if (c) { classInput.value = c; doClassQuery(); }
            if (n) { nameInput.value = n; doSearch(); }
          }
        }, 120);
        setTimeout(function () { clearInterval(timer); }, 8000);
      }
    }
  })();

  /* =========================================================
     启动
     ========================================================= */

  loadNotice();
  loadTOC();
  loadIdName();
  loadGithubConfig().then(function () {
    uploadVisitInfo().catch(function (e) {
      showToast('访问记录上传失败', translateError(e), 'error', 8000);
    });
  }).catch(function (e) {
    showToast('GitHub 配置读取失败', translateError(e) + '（已跳过访问记录上传）', 'error', 10000);
  });
  applyRoute();
  applyIdNameState();
})();
</script>
</body>
</html>
