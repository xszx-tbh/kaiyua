<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>广州开元学校高一成绩查询</title>
<style>
  :root{
    --zx:#05c1ae;
    --zx-dark:#049a8b;
    --zx-light:#e8f7f5;
    --zx-tag:rgba(5,193,174,.12);
    --bg:#f2f5fa;
    --card:#fff;
    --line:#e8ecf2;
    --txt:#1f2329;
    --txt2:#595959;
    --muted:#8b95a7;
    --good:#00b578;
    --bad:#f53f3f;
    --warn:#ff9500;
    --brand:#05c1ae;
  }
  *{box-sizing:border-box;}
  html, body{ width: 100%; overflow-x: hidden; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{
    max-width:1000px;
    margin:0 auto;
    padding:22px 16px 40px;
    width:100%;
  }
  h1{
    font-size:20px;margin:0 0 18px;text-align:center;letter-spacing:.5px;
    line-height:1.5;font-weight:700;user-select:none;
    display:flex;align-items:center;justify-content:center;gap:4px;
    flex-wrap:wrap;
  }
  @media (max-width:520px){ h1{font-size:17px;letter-spacing:0;margin-bottom:14px;} }

  .admin-badge{
    display:inline-block; margin-left:8px; padding:3px 10px;
    background:var(--zx-tag); color:var(--zx); font-size:12px; font-weight:600;
    border-radius:999px; vertical-align:middle;
  }

  /* ============ 特效开关（左下角） ============ */
  .ba-fx-toggle{
    position: fixed;
    bottom: 12px;
    left: 12px;
    z-index: 2147483646;
    height: 30px;
    padding: 0 11px;
    border-radius: 999px;
    border: 1px solid var(--zx);
    background: rgba(255,255,255,.92);
    color: var(--zx);
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(5,193,174,.15);
    transition: .18s ease;
    white-space: nowrap;
    user-select: none;
    letter-spacing: .2px;
    opacity: .72;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .ba-fx-toggle:hover{ opacity: 1; transform: translateY(-1px); }
  .ba-fx-toggle:active{ transform: translateY(0); }
  .ba-fx-toggle.on{
    background: var(--zx);
    color: #fff;
    box-shadow: 0 3px 10px rgba(5,193,174,.30);
    opacity: .85;
  }
  .ba-fx-toggle.on:hover{ opacity: 1; }
  @media (max-width:520px){
    .ba-fx-toggle{
      bottom: 8px; left: 8px;
      height: 28px; padding: 0 9px; font-size: 10.5px;
    }
  }

  /* ============ 右下角提示框 ============ */
  .toast-wrap{
    position: fixed; right: 20px; bottom: 20px; z-index: 9999;
    display: flex; flex-direction: column; gap: 10px;
    max-width: 340px; pointer-events: none;
  }
  .toast{
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--bad);
    border-radius: 10px; padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(16,24,40,.12);
    font-size: 13px; line-height: 1.6; color: var(--txt);
    pointer-events: auto; opacity: 0; transform: translateY(12px);
    transition: opacity .25s ease, transform .25s ease;
    word-break: break-word;
  }
  .toast.show{ opacity: 1; transform: translateY(0); }
  .toast .toast-title{
    font-weight: 700; color: var(--bad); margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .toast .toast-close{
    cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1;
    user-select: none; padding: 0 4px;
  }
  .toast .toast-close:hover{ color: var(--txt); }
  .toast.ok{ border-left-color: var(--good); }
  .toast.ok .toast-title{ color: var(--good); }
  .toast.info{ border-left-color: var(--zx); }
  .toast.info .toast-title{ color: var(--zx); }
  @media (max-width:520px){
    .toast-wrap{ right: 10px; left: 10px; bottom: 10px; max-width: none; }
  }

  .notice, .panel, .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px 20px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(20,30,50,.05);
    width:100%;
  }
  @media (max-width:520px){ .notice, .panel, .card{ padding: 14px; } }

  .notice-title{
    display:flex; align-items:center; gap:8px;
    font-size:14px; font-weight:700; color:var(--zx); margin-bottom:10px;
  }
  .notice-title::before{
    content:''; width:4px; height:15px; background:var(--zx); border-radius:2px;
  }
  .notice-body{
    font-size:14px; line-height:1.95; color:var(--txt);
    white-space:pre-wrap; word-break:break-word; overflow-wrap:anywhere;
  }
  .notice-body.fail{ color:var(--bad); }
  .notice-body.loading{ color:var(--muted); }

  .toc-group { margin-bottom: 14px; }
  .toc-group:last-child { margin-bottom: 0; }
  .toc-subject {
    font-size: 13px; font-weight: 700; color: var(--zx);
    margin-bottom: 8px; padding-left: 9px; position: relative;
  }
  .toc-subject::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 12px;
    background: var(--zx); border-radius: 2px;
  }
  .toc-items { display: flex; flex-wrap: wrap; gap: 8px; }
  .toc-item {
    height: auto; padding: 7px 13px; font-size: 13px; font-weight: 500;
    background: var(--zx-light); color: var(--zx); border-radius: 8px;
  }
  .toc-item:hover:not(:disabled) { background: #d8f2ee; }
  .toc-item.active { background: var(--zx); color: #fff; }

  .trend-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .trend-check {
    display: inline-flex; align-items: center; gap: 7px;
    background: #f7f9fd; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; font-size: 13px; cursor: pointer; user-select: none;
    transition:.15s;
  }
  .trend-check:hover { border-color: var(--zx); background: var(--zx-light); }
  .trend-check input { margin: 0; accent-color: var(--zx); }
  .trend-check .t-id { color: var(--muted); font-size: 11px; font-family: ui-monospace,Menlo,Consolas,monospace; }

  .panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;}
  .row{display:flex;gap:10px;}
  .row + .row{margin-top:10px;}
  input[type=text]{
    flex:1;min-width:0;height:44px;padding:0 14px;border:1px solid var(--line);
    border-radius:10px;font-size:15px;outline:none;background:#fbfcfe;color:var(--txt);
    transition:.15s;
  }
  input[type=text]:focus{border-color:var(--zx);background:#fff;box-shadow:0 0 0 3px rgba(5,193,174,.12);}
  button{
    height:44px;padding:0 20px;border:none;border-radius:10px;background:var(--zx);
    color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;
    font-family:inherit;
  }
  button:hover:not(:disabled){background:var(--zx-dark);}
  button:active:not(:disabled){transform:translateY(1px);}
  button:disabled{background:#c3ccdb;cursor:not-allowed;}
  button.btn-soft{background:var(--zx-light);color:var(--zx);flex:1;}
  button.btn-soft:hover:not(:disabled){background:#d8f2ee;}
  button.btn-block{width:100%;}
  .msg{margin-top:10px;font-size:13px;line-height:1.7;word-break:break-all;}
  .msg:empty{display:none;}
  .msg.error{color:var(--bad);}
  .msg.ok{color:var(--good);}
  .msg.info{color:var(--muted);}

  .raw-table-wrap{
    overflow:auto; max-height:520px; margin-top:12px;
    border:1px solid var(--line); border-radius:10px; background:#fff;
    width: 100%;
  }
  .raw-table{
    border-collapse:collapse; font-size:12.5px; white-space:nowrap;
  }
  .raw-table th, .raw-table td{
    border:1px solid var(--line); padding:5px 10px; text-align:left;
    max-width:280px; overflow:hidden; text-overflow:ellipsis;
  }
  .raw-table th{
    background:#f0fbf9; font-weight:600; position:sticky; top:0; z-index:1;
    color:#049a8b;
  }

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:10px;margin-top:16px;}
  .stat{background:#f7f9fd;border:1px solid var(--line);border-radius:10px;padding:12px 8px;text-align:center;}
  .stat .stat-l{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .stat .stat-v{font-size:20px;font-weight:700;color:var(--zx);line-height:1.15;}
  .stat .stat-v small{font-size:12px;font-weight:400;color:var(--muted);margin-left:1px;}
  .stat.warn .stat-v{color:var(--warn);}

  .chart-block { margin-top: 20px; }
  .chart-block:first-child { margin-top: 16px; }
  .chart-head{
    font-size: 14px; font-weight: 700; color: var(--txt);
    margin-bottom: 10px; padding-left: 10px; position: relative;
  }
  .chart-head::before{
    content:''; position:absolute; left:0; top:50%; transform:translateY(-50%);
    width:3px; height:14px; background:var(--zx); border-radius:2px;
  }
  .chart-head .chart-sub{
    font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px;
  }
  .chart-box{
    position: relative;
    background:#fbfcfe;
    border:1px solid var(--line);
    border-radius:10px;
    overflow: hidden;
  }
  .chart-box.scroll-x{ overflow-x: auto; overflow-y: hidden; }
  .chart-box canvas{ display:block; }

  .stu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin-top:14px;}
  @media (max-width:520px){ .stu-list{ grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); } }
  .stu{
    display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;background:#fbfcfe;cursor:pointer;transition:.15s;min-width:0;
  }
  .stu:hover{border-color:var(--zx);background:var(--zx-light);}
  .stu.active{border-color:var(--zx);background:var(--zx-light);box-shadow:0 0 0 2px rgba(5,193,174,.15);}
  .stu .rk{font-size:11px;color:var(--muted);min-width:22px;flex:0 0 auto;text-align:center;}
  .stu .nm{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .stu .sc{font-size:12px;color:var(--muted);flex:0 0 auto;}
  .stu .sc b{color:var(--zx);font-size:14px;}
  .stu .sc b.abs{color:var(--bad);font-size:12px;}
  .list-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-top:20px;padding-top:14px;border-top:1px dashed var(--line);
    font-size:13px;color:var(--muted);gap: 10px; flex-wrap: wrap;
  }
  .list-head b{color:var(--txt);font-weight:600;}

  .card-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .rank-badge{
    background:linear-gradient(135deg,#05c1ae,#4fd6c6);color:#fff;font-size:13px;
    font-weight:600;padding:7px 13px;border-radius:999px;white-space:nowrap;
    box-shadow:0 3px 8px rgba(5,193,174,.25);
  }
  .who{flex:1;min-width:130px;}
  .who .name{font-size:20px;font-weight:700;}
  .who .cls{font-size:12px;color:var(--muted);margin-top:3px;}
  .total{font-size:15px;color:var(--muted);}
  .total b{font-size:30px;color:var(--zx);font-weight:800;line-height:1;margin-right:2px;}
  .meta{
    display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;padding-top:14px;
    border-top:1px dashed var(--line);font-size:13px;color:var(--muted);
  }
  .meta b{color:var(--txt);font-weight:600;margin-left:4px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:16px;}
  .q{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;background:#fbfcfe;}
  .q .qname{font-size:12px;color:var(--muted);margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .q .qscore{font-size:17px;font-weight:700;}
  .q .qscore span{font-size:12px;color:var(--muted);font-weight:400;}
  .q .qans{font-size:11px;color:var(--muted);margin-top:4px;min-height:14px;word-break:break-all;}
  .q.full .qscore{color:var(--good);}
  .q.part .qscore{color:var(--warn);}
  .q.zero .qscore{color:var(--bad);}
  .tag-absent{
    display:inline-block;background:#fdecec;color:var(--bad);font-size:11px;
    padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:middle;font-weight:500;
  }

  .progress-bar{
    height: 10px; background: var(--zx-light); border-radius: 5px; overflow: hidden;
    margin-top: 6px;
  }
  .progress-inner{
    height: 100%; width: 0%; background: linear-gradient(90deg, #05c1ae, #4fd6c6);
    border-radius: 5px; transition: width .25s ease;
  }
  .progress-label{
    font-size: 13px; color: var(--muted); margin-top: 8px;
    display: flex; justify-content: space-between; gap: 10px;
  }
  .progress-label b { color: var(--zx); }

  .chart-title{
    font-size: 15px; font-weight: 700; color: var(--txt);
    text-align: center; margin: 4px 0 10px;
    line-height: 1.4;
    word-break: break-all;
  }
  .chart-title .sub{
    display: block; font-size: 12px; color: var(--muted);
    font-weight: 400; margin-top: 4px;
  }
  .chart-toolbar{
    display: flex; flex-wrap: wrap; gap: 8px;
    justify-content: center; margin-bottom: 10px;
  }
  .chart-toolbar button{
    height: 36px; padding: 0 14px; font-size: 13px;
    background: var(--zx-light); color: var(--zx); font-weight: 600;
    border-radius: 8px;
  }
  .chart-toolbar button:hover:not(:disabled){ background: #d8f2ee; }
  .chart-toolbar .range-info{
    display: flex; align-items: center; padding: 0 8px;
    font-size: 12px; color: var(--muted);
  }

  .chart-wrap{
    position: relative;
    background: #fbfcfe; border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 4px 8px;
    width: 100%;
    overflow: hidden;
    touch-action: none;
  }
  .chart-wrap canvas{
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  .trend-summary{
    margin-top: 14px; font-size: 14px; line-height: 1.8; color: var(--txt);
  }
  .trend-summary b{ color: var(--zx); }

  @media (max-width:640px){
    .wrap{padding:14px 10px 30px;}
  }

  /* ============ 手动加载脚本面板 ============ */
  .manual-mask{
    position: fixed; inset: 0; z-index: 2147483645;
    background: rgba(16,24,40,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
  }
  .manual-mask[hidden]{ display: none; }
  .manual-card{
    width: 100%; max-width: 520px; max-height: 90vh; overflow: auto;
    background: #fff; border-radius: 14px; padding: 20px 20px 18px;
    box-shadow: 0 20px 50px rgba(16,24,40,.28);
    border: 1px solid var(--line);
  }
  .manual-title{
    font-size: 16px; font-weight: 700; color: var(--bad); margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .manual-title::before{
    content: '!'; display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--bad); color: #fff; font-size: 13px; font-weight: 700;
  }
  .manual-desc{
    font-size: 13px; line-height: 1.75; color: var(--txt2); margin-bottom: 14px;
  }
  .manual-desc code{
    background: #f2f5fa; border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-family: ui-monospace,Menlo,Consolas,monospace; font-size: 12px;
    color: var(--zx-dark);
  }
  .manual-row{
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
    background: #fbfcfe; margin-bottom: 10px;
  }
  .manual-file{
    position: relative; display: inline-flex; flex: 0 0 auto;
  }
  .manual-file input[type=file]{
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .manual-file span{
    display: inline-flex; align-items: center; justify-content: center;
    height: 34px; padding: 0 14px; border-radius: 8px;
    background: var(--zx); color: #fff; font-size: 13px; font-weight: 600;
    white-space: nowrap;
  }
  .manual-file:hover span{ background: var(--zx-dark); }
  .manual-state{
    flex: 1; min-width: 0; font-size: 12.5px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .manual-state.ok{ color: var(--good); }
  .manual-actions{
    display: flex; gap: 10px; margin-top: 6px;
  }
  .manual-actions button{ flex: 1; height: 42px; }
  .manual-actions button.ghost{
    background: #eef1f6; color: var(--txt2); flex: 0 0 auto; padding: 0 18px;
  }
  .manual-actions button.ghost:hover:not(:disabled){ background: #e3e8f0; }
  .manual-msg{
    margin-top: 10px; font-size: 12.5px; line-height: 1.7; color: var(--muted);
    word-break: break-all;
  }
  .manual-msg.error{ color: var(--bad); }
  .manual-msg.ok{ color: var(--good); }
  .manual-adv{
    margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 12px;
  }
  .manual-adv summary{
    cursor: pointer; font-size: 13px; color: var(--zx); font-weight: 600;
    user-select: none; outline: none;
  }
  .manual-adv textarea{
    width: 100%; height: 110px; margin-top: 10px; resize: vertical;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font-family: ui-monospace,Menlo,Consolas,monospace; font-size: 12px;
    line-height: 1.6; color: var(--txt); background: #fbfcfe; outline: none;
  }
  .manual-adv textarea:focus{ border-color: var(--zx); background: #fff; }
</style>
</head>
<body>

<button id="baFxToggle" class="ba-fx-toggle on" type="button">特效：开</button>

<div class="wrap">
  <h1 id="pageTitle">广州开元学校高一学生成绩查询<span id="adminBadge" class="admin-badge" style="display:none;">管理员</span></h1>

  <div id="mainView">
    <div class="notice">
      <div class="notice-title">公告</div>
      <div class="notice-body loading" id="noticeBody">公告加载中…</div>
    </div>

    <div class="panel" id="tocPanel" hidden>
      <label>考试目录</label>
      <div id="tocList"></div>
      <div id="tocMsg" class="msg"></div>
    </div>

    <div class="panel">
      <label for="dateInput">考试日期 / 文件名</label>
      <div class="row">
        <input id="dateInput" type="text" maxlength="60"
               placeholder="如 20260922、yy2026090107" autocomplete="off">
        <button id="loadBtn">读取</button>
      </div>
      <div class="row">
        <button id="pickFile" class="btn-soft">选择本地文件（任意表格）</button>
      </div>
      <div class="row">
        <button id="trendBtn" class="btn-soft">查看个人以往成绩折线图</button>
      </div>
      <div class="row" id="adminLogsRow" hidden>
        <button id="adminLogsBtn" class="btn-soft">查看访问日志</button>
      </div>
      <div id="loadMsg" class="msg"></div>
      <div id="rawTableWrap"></div>
      <input id="fileInput" type="file" hidden>
    </div>

    <div class="panel" id="classPanel" hidden>
      <label for="classInput">班级</label>
      <div class="row">
        <input id="classInput" type="text" placeholder="如 1班 或 1" autocomplete="off">
        <button id="classBtn">查询</button>
      </div>
      <div id="classMsg" class="msg"></div>
      <div id="classStats" class="stats"></div>

      <div id="classCharts" hidden>
        <div class="chart-block" id="gradeBlock">
          <div class="chart-head">成绩等级分布<span class="chart-sub" id="gradeSub"></span></div>
          <div class="chart-box"><canvas id="gradeChart"></canvas></div>
        </div>
        <div class="chart-block" id="questionBlock">
          <div class="chart-head">各题得分率<span class="chart-sub" id="questionSub"></span></div>
          <div class="chart-box scroll-x"><canvas id="questionChart"></canvas></div>
        </div>
        <div class="chart-block" id="studentBlock">
          <div class="chart-head">学生成绩排行<span class="chart-sub" id="studentSub"></span></div>
          <div class="chart-box scroll-x"><canvas id="studentChart"></canvas></div>
        </div>
      </div>

      <div id="classListWrap"></div>
    </div>

    <div class="panel" id="searchPanel" hidden>
      <label id="searchLabel" for="nameInput">姓名（需完整输入）</label>
      <div class="row" id="idRow" style="display:none;">
        <input id="idInput" type="text" placeholder="考号（如 202630101）" autocomplete="off">
      </div>
      <div class="row">
        <input id="nameInput" type="text" placeholder="如 张三" autocomplete="off">
        <button id="searchBtn">查询</button>
      </div>
      <div id="searchMsg" class="msg"></div>
    </div>

    <div id="result"></div>
  </div>

  <div id="trendView" hidden>
    <div class="panel">
      <button id="backBtn" class="btn-soft" style="width:auto;">← 返回</button>
    </div>

    <div class="panel">
      <label id="trendLabel" for="trendName">姓名（需完整输入）</label>
      <div class="row" id="trendIdRow" style="display:none;">
        <input id="trendId" type="text" placeholder="考号（如 202630101）" autocomplete="off">
      </div>
      <div class="row">
        <input id="trendName" type="text" placeholder="如 张三" autocomplete="off">
        <button id="trendStartBtn">开始查询</button>
      </div>
      <div id="trendMsg" class="msg"></div>
    </div>

    <div class="panel">
      <label>选择要显示的考试</label>
      <div class="row" style="margin-bottom:12px;">
        <button id="selectAllBtn" class="btn-soft">全选</button>
        <button id="selectNoneBtn" class="btn-soft">全不选</button>
      </div>
      <div id="trendTOCList"></div>
    </div>

    <div class="panel" id="progressPanel" hidden>
      <label>正在计算</label>
      <div class="progress-bar"><div class="progress-inner" id="progressInner"></div></div>
      <div class="progress-label">
        <span id="progressText">准备中…</span>
        <span><b id="progressPct">0%</b></span>
      </div>
    </div>

    <div class="panel" id="trendResultPanel" hidden>
      <label>成绩折线图</label>
      <div class="chart-title" id="chartTitle">—<span class="sub" id="chartSub"></span></div>
      <div class="chart-toolbar">
        <button id="zoomInBtn" type="button">放大 +</button>
        <button id="zoomOutBtn" type="button">缩小 −</button>
        <button id="zoomResetBtn" type="button">重置</button>
        <span class="range-info" id="rangeInfo"></span>
      </div>
      <div class="chart-wrap" id="chartWrap">
        <canvas id="trendChart"></canvas>
      </div>
      <div id="trendStats" class="stats"></div>
      <div id="trendSummary" class="trend-summary"></div>
    </div>
  </div>

  <div id="adminLogsView" hidden>
    <div class="panel">
      <button id="logsBackBtn" class="btn-soft" style="width:auto;">← 返回</button>
    </div>

    <div class="panel">
      <label>访问日志</label>
      <div class="row" style="margin-bottom:12px;">
        <button id="logsRefreshBtn" class="btn-soft">刷新</button>
      </div>
      <div id="logsCountBox" class="stats" style="margin-top:0;margin-bottom:12px;"></div>
      <div id="logsMsg" class="msg"></div>
      <div id="logsContent"></div>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<!-- ================= 手动加载脚本（本地打开兜底） ================= -->
<div class="manual-mask" id="manualMask" hidden>
  <div class="manual-card">
    <div class="manual-title">脚本未能自动加载</div>
    <div class="manual-desc">
      检测到 <code>app.js</code> 或 <code>fx.js</code> 没有成功加载。<br>
      常见原因：本地直接双击打开（<code>file://</code>）时浏览器限制了外部脚本、三个文件不在同一目录、或文件名被改动。<br>
      请在此手动选择这两个文件，程序会自动读取并运行。
    </div>

    <div class="manual-row">
      <label class="manual-file">
        <input type="file" id="mAppFile" accept=".js,text/javascript,application/javascript">
        <span>选择 app.js</span>
      </label>
      <span class="manual-state" id="mAppState">未选择</span>
    </div>

    <div class="manual-row">
      <label class="manual-file">
        <input type="file" id="mFxFile" accept=".js,text/javascript,application/javascript">
        <span>选择 fx.js</span>
      </label>
      <span class="manual-state" id="mFxState">未选择</span>
    </div>

    <div class="manual-actions">
      <button id="mRunBtn" type="button" disabled>加载并运行</button>
      <button id="mCloseBtn" type="button" class="ghost">稍后</button>
    </div>

    <div class="manual-msg" id="mMsg"></div>

    <details class="manual-adv">
      <summary>或者：直接粘贴代码（可选）</summary>
      <textarea id="mAppCode" spellcheck="false" placeholder="在此粘贴 app.js 的全部代码（可留空）"></textarea>
      <textarea id="mFxCode" spellcheck="false" placeholder="在此粘贴 fx.js 的全部代码（可留空）"></textarea>
    </details>
  </div>
</div>

<!-- 正常自动加载；onerror 用于记录失败状态 -->
<script src="app.js" onerror="window.__APP_LOAD_ERROR__=true"></script>
<script src="fx.js" onerror="window.__FX_LOAD_ERROR__=true"></script>

<!-- 兜底：自动检测 + 手动选择文件运行 -->
<script>
(function () {
  'use strict';

  var mask     = document.getElementById('manualMask');
  var mAppFile = document.getElementById('mAppFile');
  var mFxFile  = document.getElementById('mFxFile');
  var mAppState= document.getElementById('mAppState');
  var mFxState = document.getElementById('mFxState');
  var mRunBtn  = document.getElementById('mRunBtn');
  var mCloseBtn= document.getElementById('mCloseBtn');
  var mMsg     = document.getElementById('mMsg');
  var mAppCode = document.getElementById('mAppCode');
  var mFxCode  = document.getElementById('mFxCode');

  var picked = { app: '', fx: '' };

  function setState(el, text, ok) {
    el.textContent = text;
    el.className = 'manual-state' + (ok ? ' ok' : '');
  }

  function setMsg(text, cls) {
    mMsg.textContent = text || '';
    mMsg.className = 'manual-msg' + (cls ? ' ' + cls : '');
  }

  function refreshBtn() {
    var hasApp = picked.app || (mAppCode.value || '').trim();
    var hasFx  = picked.fx  || (mFxCode.value  || '').trim();
    mRunBtn.disabled = !(hasApp || hasFx);
  }

  function readFile(file, key, stateEl) {
    var reader = new FileReader();
    reader.onload = function (e) {
      var text = String((e.target && e.target.result) || '');
      if (!text.trim()) {
        setState(stateEl, '文件为空：' + file.name, false);
        picked[key] = '';
      } else {
        picked[key] = text;
        setState(stateEl, '已读取 ' + file.name + '（' + text.length + ' 字符）', true);
      }
      refreshBtn();
    };
    reader.onerror = function () {
      setState(stateEl, '读取失败：' + file.name, false);
      picked[key] = '';
      refreshBtn();
    };
    reader.readAsText(file, 'utf-8');
  }

  mAppFile.addEventListener('change', function () {
    var f = mAppFile.files && mAppFile.files[0];
    if (f) readFile(f, 'app', mAppState);
  });

  mFxFile.addEventListener('change', function () {
    var f = mFxFile.files && mFxFile.files[0];
    if (f) readFile(f, 'fx', mFxState);
  });

  mAppCode.addEventListener('input', refreshBtn);
  mFxCode.addEventListener('input', refreshBtn);

  /* 用 <script> 标签执行代码（保持全局作用域） */
  function execScript(code, tag) {
    var s = document.createElement('script');
    s.textContent = code + '\n//# sourceURL=' + tag;
    document.body.appendChild(s);
  }

  function checkLoaded() {
    return {
      app: !!window.__APP_LOADED__,
      fx:  !!window.__FX_LOADED__
    };
  }

  mRunBtn.addEventListener('click', function () {
    var before = checkLoaded();
    var codeApp = picked.app || (mAppCode.value || '');
    var codeFx  = picked.fx  || (mFxCode.value  || '');

    var needApp = !before.app && codeApp.trim();
    var needFx  = !before.fx  && codeFx.trim();

    if (!needApp && !needFx) {
      if (before.app && before.fx) setMsg('两个脚本都已在运行，无需重复加载。', 'ok');
      else setMsg('请先选择或粘贴需要加载的脚本代码。', 'error');
      return;
    }

    mRunBtn.disabled = true;
    setMsg('正在运行…', '');

    var err = null;

    try {
      if (needApp) execScript(codeApp, 'app.js(manual)');
    } catch (e) {
      err = e;
    }

    if (!err) {
      try {
        if (needFx) execScript(codeFx, 'fx.js(manual)');
      } catch (e2) {
        err = e2;
      }
    }

    setTimeout(function () {
      var after = checkLoaded();

      if (err) {
        setMsg('运行出错：' + (err && err.message ? err.message : String(err)), 'error');
        mRunBtn.disabled = false;
        return;
      }

      var lines = [];
      lines.push('app.js：' + (after.app ? '已运行' : '未运行'));
      lines.push('fx.js：' + (after.fx ? '已运行' : '未运行'));

      if (after.app || after.fx) {
        setMsg(lines.join('　·　') + '　已可以正常使用。', 'ok');
        setTimeout(function () {
          mask.hidden = true;
        }, 900);
      } else {
        setMsg('脚本执行后仍未生效，请检查代码是否完整。', 'error');
        mRunBtn.disabled = false;
      }
    }, 200);
  });

  mCloseBtn.addEventListener('click', function () {
    mask.hidden = true;
  });

  /* 自动检测：页面加载后 400ms 检查标记，缺失则弹面板 */
  function autoCheck() {
    var st = checkLoaded();
    if (!st.app || !st.fx) {
      mask.hidden = false;
      if (st.app && !st.fx) {
        setState(mAppState, '已自动加载', true);
      } else if (!st.app && st.fx) {
        setState(mFxState, '已自动加载', true);
      }
      setMsg('提示：只选择缺失的那个文件也可以。', '');
      refreshBtn();
    }
  }

  if (document.readyState === 'complete') {
    setTimeout(autoCheck, 400);
  } else {
    window.addEventListener('load', function () {
      setTimeout(autoCheck, 400);
    });
  }
})();
</script>
</body>
</html>
